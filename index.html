<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dusk">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Dusk</title>
<script>
/* Before first paint: if Dusk was left in night mode, start pure black (no flash of sky at 3am). */
(function(){
  try{
    var st = JSON.parse(localStorage.getItem('dusk_state') || '{}');
    if (st.mode === 'night') document.documentElement.setAttribute('data-screen', 'night');
  }catch(e){}
})();
</script>
<style>
/* ---------- Tokens ---------- */
:root{
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px;
  --r:26px; --r-sm:16px; --r-xs:10px;
  --accent:#ffb27d; --on-accent:#2b1608; --moon:#d8ccff;
  --ink:#f6f4ff; --ink2:rgba(246,244,255,.70); --ink3:rgba(246,244,255,.44);
  --glass:rgba(20,22,50,.30); --glass-hi:rgba(255,255,255,.12);
  --sheet:rgba(22,22,48,.70);
  --stroke:rgba(255,255,255,.17); --hair:rgba(255,255,255,.08);
  --gloss:inset 0 1px 0 rgba(255,255,255,.24);
  --drop:0 18px 44px -18px rgba(0,0,0,.65);
  --blur:blur(24px) saturate(170%);
  --ease:cubic-bezier(.32,.72,0,1); --fast:180ms; --med:340ms;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --good:#7fe0a8; --warn:#ffc46b; --bad:#ff7a6e;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  /* sky (JS, every minute) */
  --sky-top:#0e1235; --sky-mid:#2a2252; --sky-low:#6b3f5e; --glow:rgba(192,96,122,.55); --stars:0;
  /* home screen look (JS, from settings) */
  --d-font:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif; --d-weight:200; --d-scale:1; --d-color:#f6f4ff;
  --d-shift:0vh; --d-align:center;
  /* night look */
  --n-font:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif; --n-weight:300; --n-scale:1;
  --night:#ff3b30; --dim:.18; --peek:.45;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;color:var(--ink);overflow:hidden;
  font:16px/1.35 var(--font);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
html[data-screen="night"] #day{display:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
input[type=text],input[type=time],input[type=date],input[type=number]{-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
svg.i{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* full-bleed screens: fixed + explicit 100vw/100dvh so nothing letterboxes on big iPads */
.screen{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.clock{font-variant-numeric:tabular-nums;letter-spacing:-.035em;line-height:.9;white-space:nowrap}
.clock .ap{font-family:var(--font);font-size:.17em;font-weight:500;letter-spacing:.04em;margin-left:.2em;vertical-align:.32em;opacity:.7}

/* ---------- Glass ---------- */
.glass{background:linear-gradient(180deg,var(--glass-hi),rgba(255,255,255,0) 60%),var(--glass);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--stroke);box-shadow:var(--gloss),var(--drop)}

/* ---------- Wallpaper ---------- */
.wall{position:absolute;inset:0;overflow:hidden;background:#000}
.wall .layer{position:absolute;inset:0;background-size:cover;background-position:center}
.wall .sky{background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 58%,var(--sky-low) 100%);transition:background 2s}
.wall .sky::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 38% at 50% 108%,var(--glow),transparent 70%)}
.wall .stars{inset:0 0 35% 0;opacity:calc(var(--stars) * .75);transition:opacity 2s;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 18%,#fff 60%,transparent),radial-gradient(1px 1px at 27% 9%,#fff 60%,transparent),
    radial-gradient(1.2px 1.2px at 41% 24%,#fff 60%,transparent),radial-gradient(1px 1px at 58% 12%,#fff 60%,transparent),
    radial-gradient(1.6px 1.6px at 73% 20%,#fff 60%,transparent),radial-gradient(1px 1px at 86% 8%,#fff 60%,transparent),
    radial-gradient(1.1px 1.1px at 92% 30%,#fff 60%,transparent),radial-gradient(1px 1px at 6% 36%,#fff 60%,transparent),
    radial-gradient(1.2px 1.2px at 34% 40%,#fff 60%,transparent),radial-gradient(1px 1px at 66% 34%,#fff 60%,transparent),
    radial-gradient(1px 1px at 50% 5%,#fff 60%,transparent),radial-gradient(1.3px 1.3px at 19% 52%,#fff 60%,transparent)}
.wall .photo{transform:scale(1.08)}
.wall .shade{background:#000}

/* ---------- Day ---------- */
#day .face{position:relative;z-index:1;display:flex;flex-direction:column;align-items:var(--d-align);
  width:100%;padding:0 7vw;transform:translateY(var(--d-shift));color:var(--d-color);
  text-shadow:0 2px 24px rgba(0,0,0,.28);transition:transform 4s ease}
#day .date{font-size:clamp(18px,2.2vw,30px);font-weight:500;opacity:.72;letter-spacing:.01em}
#dClock{font-family:var(--d-font);font-weight:var(--d-weight);font-size:calc(min(22vw,42vh) * var(--d-scale));margin:.04em 0 .08em}
.lines{display:flex;flex-direction:column;align-items:var(--d-align);gap:.45em}
.aline{font-size:clamp(17px,2.1vw,26px);font-weight:500;display:flex;align-items:center;gap:.45em}
.aline.none{opacity:.5}
.aline .in{opacity:.7;font-weight:400}
.aline svg.i{width:1.05em;height:1.05em}
.aline.soon{color:var(--warn)}
.update{position:absolute;top:calc(18px + var(--safe-t));z-index:3;border-radius:999px;padding:9px 18px;font-size:15px;font-weight:600}

.ctrls{position:absolute;z-index:3;left:0;right:0;bottom:calc(30px + var(--safe-b));display:flex;justify-content:center;align-items:flex-end;gap:22px;
  opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity var(--med) var(--ease),transform var(--med) var(--ease)}
.ctrls.show{opacity:1;transform:none;pointer-events:auto}
.cb{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink)}
.cb .disc{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;transition:transform var(--fast) var(--ease)}
.cb:active .disc{transform:scale(.93)}
.cb.main .disc{width:auto;padding:0 28px;border-radius:999px;gap:10px;font-size:19px;font-weight:650;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0)),rgba(216,204,255,.24)}
.cb.main .disc svg{font-size:24px}
.hint{position:absolute;z-index:2;bottom:calc(14px + var(--safe-b));font-size:13px;color:var(--ink3);transition:opacity 1s}

/* ---------- Night ---------- */
#night{background:#000;cursor:none}
.nwrap{display:flex;flex-direction:column;align-items:center;color:var(--night);opacity:var(--dim);transition:opacity .6s,transform 4s ease}
#night.peek .nwrap{opacity:var(--peek)}
#nClock{font-family:var(--n-font);font-weight:var(--n-weight);font-size:calc(min(24vw,46vh) * var(--n-scale))}
.nline{font-size:clamp(16px,2vw,24px);font-weight:500;margin-top:.55em;display:flex;align-items:center;gap:.4em}
.nline .in{opacity:.7;font-weight:400}
.narm{font-size:15px;margin-top:1.3em;padding:7px 16px;border:1px solid currentColor;border-radius:999px}
.peekbar{position:absolute;bottom:calc(34px + var(--safe-b));display:flex;align-items:center;gap:16px;opacity:0;pointer-events:none;transition:opacity .4s}
#night.peek .peekbar{opacity:1;pointer-events:auto}
.gm{display:flex;align-items:center;gap:12px;border-radius:999px;padding:18px 32px;font-size:21px;font-weight:650;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.82)}
.gm svg.i{width:28px;height:28px}
.px{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6)}

/* ---------- Ringing ---------- */
#ring{background:linear-gradient(180deg,#1f2c5c 0%,#5a5f8e 55%,#e09a7c 100%);gap:14px}
#ring::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 40% at 50% 108%,rgba(255,179,138,.75),transparent 70%);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
#ring>*{position:relative}
#rClock{font-family:var(--d-font);font-weight:var(--d-weight);font-size:min(19vw,34vh)}
.rlabel{font-size:clamp(22px,2.6vw,30px);font-weight:600}
.rbtns{display:flex;gap:20px;margin-top:22px}
.big{border-radius:32px;min-width:240px;padding:32px 40px;font-size:28px;font-weight:700;transition:transform var(--fast) var(--ease)}
.big:active{transform:scale(.96)}
.big.snooze{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0)),var(--accent);color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),var(--drop)}

/* ---------- Sheet + pages ---------- */
.sheetbg{position:fixed;inset:0;z-index:20;background:rgba(4,4,16,.45);display:flex;align-items:center;justify-content:center;animation:fade var(--fast)}
@keyframes fade{from{opacity:0}}
.sheet{width:min(640px,94vw);height:min(860px,90vh);display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 30%),var(--sheet);
  -webkit-backdrop-filter:blur(34px) saturate(170%);backdrop-filter:blur(34px) saturate(170%);
  border:1px solid var(--stroke);border-radius:32px;box-shadow:var(--gloss),0 40px 90px -20px rgba(0,0,0,.7);animation:rise var(--med) var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}
@keyframes slideback{from{opacity:0;transform:translateX(-24px)}}
.sh-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:58px;padding:8px 18px 4px;flex:none}
.sh-head h2{font-size:18px;font-weight:700;text-align:center}
.sh-head button{font-size:17px;color:var(--accent);font-weight:500;padding:8px 2px;display:flex;align-items:center;gap:2px}
.sh-head>:first-child{justify-self:start}.sh-head>:last-child{justify-self:end}
.sh-head .bold{font-weight:700}
.sh-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 22px 28px}
.sh-body.fwd{animation:slide var(--med) var(--ease)}
.sh-body.back{animation:slideback var(--med) var(--ease)}
.glabel{font-size:14px;font-weight:600;color:var(--ink2);margin:20px 6px 8px}
.ghelp{font-size:14px;color:var(--ink3);margin:8px 6px 0;line-height:1.42}
.group{background:rgba(255,255,255,.06);border:1px solid var(--hair);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;min-height:56px}
.row+.row{border-top:1px solid var(--hair)}
.row.col{flex-direction:column;align-items:stretch;gap:6px}
.row.nav{cursor:pointer}
.row.nav:active{background:rgba(255,255,255,.05)}
.rt{font-size:17px}.rs{font-size:14px;color:var(--ink3);margin-top:2px;line-height:1.38}
.rv{font-size:16px;color:var(--ink2);text-align:right}
.chev{color:var(--ink3);font-size:18px}
.ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;color:#fff}
.lead{display:flex;align-items:center;gap:14px;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 15px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid transparent;font-size:15px;font-weight:600;transition:background var(--fast)}
.chip.on{background:var(--accent);color:var(--on-accent)}
.play{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);flex:none;display:flex;align-items:center;justify-content:center;font-size:16px}
.play.on{background:var(--accent);color:var(--on-accent)}
.snd{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.snd+.snd{border-top:1px solid var(--hair)}
.snd .t{flex:1;min-width:0}.snd .t b{font-size:17px;font-weight:600;display:block}.snd .t span{font-size:14px;color:var(--ink3)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink3);flex:none}
.radio.on{border:7px solid var(--accent)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);font-size:20px;font-weight:600}
.step input{width:64px;text-align:center;background:none;border:0;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.step small{font-size:14px;color:var(--ink3);margin-left:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;margin-top:-11px;background:linear-gradient(180deg,#fff,#e9e6f5);box-shadow:0 2px 10px rgba(0,0,0,.4),inset 0 1px 0 #fff}
.rlab{display:flex;justify-content:space-between;align-items:baseline}
.rlab b{font-size:15px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.18);transition:background var(--fast)}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform var(--fast) var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(20px)}
.swatch{width:36px;height:36px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.swatch.on{border-color:#fff}
.colorin{width:36px;height:36px;border-radius:50%;border:0;padding:3px;background:conic-gradient(#ff5f6d,#ffc371,#7fe0a8,#3aa6ff,#b9a8ff,#ff5f6d);overflow:hidden}
.colorin::-webkit-color-swatch-wrapper{padding:0}.colorin::-webkit-color-swatch{border:0;border-radius:50%}
.arow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;cursor:pointer}
.arow+.arow{border-top:1px solid var(--hair)}
.arow.off .atext{opacity:.4}
.atime{font-family:var(--d-font);font-size:42px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1}
.atime small{font-family:var(--font);font-size:16px;margin-left:4px;font-weight:500}
.asub{font-size:15px;color:var(--ink2);margin-top:5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:12px;font-weight:650;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--ink2)}
.tag.g{background:rgba(216,204,255,.18);color:var(--moon)}
.tag.s{background:rgba(255,178,125,.16);color:var(--accent)}
.empty{text-align:center;color:var(--ink3);padding:26px 0 18px}
.wide{width:100%;min-height:52px;border-radius:16px;background:rgba(255,255,255,.09);font-size:17px;font-weight:650;color:var(--accent)}
.wide.mt{margin-top:14px}
.wide.pri{background:var(--accent);color:var(--on-accent)}
.danger{width:100%;min-height:52px;border-radius:16px;background:rgba(255,90,80,.14);color:var(--bad);font-size:17px;font-weight:650;margin-top:18px}
.timein{display:block;margin:6px auto 4px;font-family:var(--d-font);font-size:56px;font-weight:300;text-align:center;background:rgba(255,255,255,.07);border:1px solid var(--hair);border-radius:20px;padding:8px 22px;color:#fff;color-scheme:dark;min-width:270px}
.days{display:flex;gap:8px;justify-content:space-between}
.day{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.08);font-weight:650}
.day.on{background:var(--accent);color:var(--on-accent)}
.txt{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--hair);border-radius:14px;padding:12px 14px;font-size:17px;outline:none;color-scheme:dark}
.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nprev{display:flex;align-items:center;justify-content:center;background:#000;border-radius:14px;height:110px}
.nprev span{font-family:var(--n-font);font-weight:var(--n-weight);font-size:62px;font-variant-numeric:tabular-nums;color:var(--night);opacity:var(--dim)}
/* mini home-screen preview (lock-screen editor style) */
.mini{position:sticky;top:0;z-index:5;box-shadow:0 14px 30px -12px rgba(0,0,0,.7);width:100%;aspect-ratio:4/3;border-radius:22px;overflow:hidden;container-type:size;border:1px solid var(--stroke)}
.mini .face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:var(--d-align);padding:0 7cqw;transform:translateY(var(--d-shift-mini));color:var(--d-color);text-shadow:0 2px 12px rgba(0,0,0,.28)}
.mini .mdate{font-size:2.6cqw;font-weight:500;opacity:.72}
.mini .mclock{font-family:var(--d-font);font-weight:var(--d-weight);font-size:calc(min(22cqw,42cqh) * var(--d-scale));line-height:.9;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.mini .mclock .ap{font-size:.17em;font-weight:500;margin-left:.2em;vertical-align:.32em;opacity:.7}
.mini .mline{font-size:2.5cqw;font-weight:500;margin-top:.6cqw}
.status-dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:5px}
.st{display:flex;gap:12px;align-items:flex-start;padding:13px 16px}
.st+.st{border-top:1px solid var(--hair)}
.st .t{flex:1}.st .t b{font-size:16px;font-weight:600}.st .t p{font-size:14px;color:var(--ink3);margin-top:2px;line-height:1.38}
.st .v{font-size:14px;font-weight:600;text-align:right;max-width:44%}
.ok{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.dim{color:var(--ink3)}
.code{font:13px/1.45 ui-monospace,Menlo,monospace;background:rgba(0,0,0,.3);border-radius:12px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text;color:var(--ink2)}
.ver{text-align:center;font-size:13px;color:var(--ink3);margin-top:20px}
.toast{position:fixed;left:50%;top:calc(20px + var(--safe-t));transform:translateX(-50%);z-index:40;border-radius:999px;padding:11px 20px;font-size:15px;font-weight:600;animation:rise var(--med) var(--ease)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){.ctrls{gap:12px}.cb .disc{width:54px;height:54px}.big{min-width:150px;padding:26px 24px}}
</style>
</head>
<body>

<div id="day" class="screen">
  <div class="wall" id="wall"></div>
  <button class="update glass hidden" id="upd" data-act="reload">Update ready · tap to reload</button>
  <div class="face" id="dFace">
    <div class="date" id="dDate"></div>
    <div class="clock" id="dClock"></div>
    <div class="lines"><div class="aline" id="dAlarm"></div><div class="aline hidden" id="dLeave"></div></div>
  </div>
  <div class="ctrls" id="ctrls">
    <button class="cb" data-act="alarms"><span class="disc glass" data-ic="alarm"></span>Alarms</button>
    <button class="cb" data-act="sleeppick"><span class="disc glass" data-ic="waves"></span><span id="sleepLbl">Waves</span></button>
    <button class="cb main" data-act="night"><span class="disc glass"><span data-ic="moon"></span>Good night</span></button>
    <button class="cb" data-act="customize"><span class="disc glass" data-ic="brush"></span>Customize</button>
    <button class="cb" data-act="settings"><span class="disc glass" data-ic="gear"></span>Settings</button>
  </div>
  <div class="hint" id="hint">Tap for controls · hold to customize</div>
</div>

<script>
const APP_VERSION = 'dusk-2';
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY1 = ['S','M','T','W','T','F','S'];
const DAYN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MIN = 60000, HOUR = 3600000;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- icons (no emoji) ---------- */
const IC = {
  alarm:'<circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 1.5M5 4 2.5 6.5M19 4l2.5 2.5"/>',

  rain:'<path d="M7 15a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 6a4 4 0 0 1 .5 8"/><path d="M8 18l-1 2.5M12 17l-1 3.5M16 18l-1 2.5"/>',
  storm:'<path d="M7 15a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 6a4 4 0 0 1 .5 8"/><path d="m13 12-3 4.5h4l-3 4.5"/>',

  brush:'<path d="M18.4 2.6a2 2 0 0 1 2.9 2.9L11 15.8 8.2 13z"/><path d="M7.5 14.5c-2 0-3.5 1.4-3.5 3.5 0 1.2-.7 2-2 2.5 3.8 1.4 8 .2 8-3.3z"/>',
  car:'<path d="M5 16V11l2-5h10l2 5v5M3 16h18v3h-3v-1.5H6V19H3z"/><circle cx="7.5" cy="13.5" r=".6"/><circle cx="16.5" cy="13.5" r=".6"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  check:'<path d="M5 12.5 10 17 19 7"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  shield:'<path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/><path d="m9 12 2 2 4-4"/>',
  note:'<path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  play:'<path d="M7 5v14l12-7z" fill="currentColor" stroke="none"/>',
  stop:'<rect x="6.5" y="6.5" width="11" height="11" rx="1.5" fill="currentColor" stroke="none"/>',
  photo:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/>'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || ''}</svg>`;
function paintIcons(root = document){ root.querySelectorAll('[data-ic]').forEach(el => { if (!el._ic){ el.innerHTML = ic(el.dataset.ic) + el.innerHTML; el._ic = 1; } }); }

/* ---------- storage ---------- */
function getJSON(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }catch(e){ return d; } }
function setJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function deepMerge(base, over){
  const out = Array.isArray(base) ? [...base] : { ...base };
  for (const k in over){ if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k]) && base[k] && typeof base[k] === 'object') out[k] = deepMerge(base[k], over[k]); else if (over[k] !== undefined) out[k] = over[k]; }
  return out;
}

const DEFAULTS = {
  gentleSound:'sunrise', standardSound:'daybreak', fade:5, alarmVol:80, snooze:9, autoSnooze:15,
  sleep:'waves', sleepVol:45, sleepTone:'warm', sleepFadeIn:8,
  day:{ font:'rounded', weight:200, size:100, pos:'center', align:'center', color:'#f6f4ff', showDate:true, showAlarm:true, showLeave:true,
        wall:'sky', stars:true, grad:'dusk', solid:'#0b0d1a', dim:30, blur:0 },
  night:{ color:'#ff3b30', dim:18, size:100, font:'rounded', weight:300, showAlarm:true, showLeave:true, peekSecs:6 },
  drift:'normal',
  leave:{ key:'', buffer:10, cutoff:'10:00' }
};
let S = deepMerge(DEFAULTS, getJSON('dusk_settings', {}));
/* dusk-1 → dusk-2 migration */
(function migrate(){
  const old = getJSON('dusk_settings', {});
  const gmap = { chime:'sunrise', marimba:'drift', musicbox:'glass' }, smap = { bright:'daybreak', rise:'rise', bells:'bloom' };
  if (gmap[S.gentleSound]) S.gentleSound = gmap[S.gentleSound];
  if (smap[S.standardSound]) S.standardSound = smap[S.standardSound];
  if (old.nightColor){ S.night.color = { red:'#ff3b30', amber:'#ff9f0a', warm:'#f3e6d4' }[old.nightColor] || S.night.color; delete S.nightColor; }
  if (typeof old.dim === 'number'){ S.night.dim = old.dim; delete S.dim; }
  delete S.h24; delete S.vol; delete S.ramp; delete S.sound;
})();
let alarms = getJSON('dusk_alarms', []);
const ST = Object.assign({ mode:'day', snooze:null, lastCheck:Date.now() }, getJSON('dusk_state', {}));
if (ST.snooze && Date.now() - ST.snooze.at > 30*MIN) ST.snooze = null;
if (Date.now() - ST.lastCheck > 15*MIN) ST.lastCheck = Date.now();
let LV = Object.assign({ items:[], manual:[], fetchedAt:0, error:'', lastUpdate:'' }, getJSON('dusk_leave', {}));
let ringing = null;

function saveSettings(){ setJSON('dusk_settings', S); }
function saveAlarms(){ setJSON('dusk_alarms', alarms); }
function saveState(){ setJSON('dusk_state', ST); }
function saveLeave(){ setJSON('dusk_leave', LV); }
const getPath = p => p.split('.').reduce((o, k) => o && o[k], S);
function setPath(p, v){ const ks = p.split('.'); let o = S; while (ks.length > 1) o = o[ks.shift()]; o[ks[0]] = v; saveSettings(); }

/* ---------- time helpers (12-hour) ---------- */
function fmt(h, m){ return { hm:`${h % 12 || 12}:${pad(m)}`, ap: h < 12 ? 'AM' : 'PM' }; }
function fmtText(h, m){ const f = fmt(h, m); return f.hm + ' ' + f.ap; }
function fmtD(d){ return fmtText(d.getHours(), d.getMinutes()); }
function clockHTML(d){ const f = fmt(d.getHours(), d.getMinutes()); return esc(f.hm) + `<span class="ap">${f.ap}</span>`; }
function daysText(days){
  if (!days.length) return 'Once';
  const k = [...days].sort().join('');
  if (k === '0123456') return 'Every day';
  if (k === '12345') return 'Weekdays';
  if (k === '06') return 'Weekends';
  return [...days].sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(i => DAYN[i]).join(' ');
}
function occurrenceAfter(a, from){
  const f = new Date(from);
  for (let d = 0; d < 8; d++){
    const t = new Date(f.getFullYear(), f.getMonth(), f.getDate() + d, a.h, a.m, 0, 0);
    if (t.getTime() <= from) continue;
    if (a.days.length && !a.days.includes(t.getDay())) continue;
    return t;
  }
  return null;
}
function nextAlarm(now = Date.now()){
  let best = null;
  for (const a of alarms){
    if (!a.on) continue;
    const t = occurrenceAfter(a, now);
    if (t && (!best || t < best.t)) best = { t, a };
  }
  const sz = ST.snooze;
  if (sz && sz.at > now && (!best || sz.at < best.t.getTime())) best = { t:new Date(sz.at), a:{ label:sz.label, ring:true, gentle:sz.gentle }, snz:true };
  return best;
}
function untilText(t, now = Date.now()){
  const mins = Math.max(0, Math.ceil((t - now) / MIN));
  const h = Math.floor(mins / 60), m = mins % 60;
  return h ? `in ${h}h ${m}m` : `in ${m}m`;
}
function alarmLine(now = Date.now()){
  const n = nextAlarm(now);
  if (!n) return { none:true, html:`${ic('alarm')}No alarm set` };
  let when = '';
  if (n.t - now > 22*HOUR) when = ' ' + DAYN[n.t.getDay()];
  const extra = n.snz ? ' · snoozed' : n.a.ring === false ? ' · silent' : '';
  return { none:false, html:`${ic('alarm')}${esc(fmtD(n.t))}${when} <span class="in">· ${untilText(n.t, now)}${extra}</span>` };
}

/* ---------- leave by ---------- */
function parseHM(s){ const m = /^(\d{1,2}):(\d{2})/.exec(String(s || '')); return m ? [+m[1], +m[2]] : null; }
function atDay(day, hm){ const [y, mo, d] = day.split('-').map(Number); return new Date(y, mo - 1, d, hm[0], hm[1], 0, 0); }
function todayStr(d = new Date()){ return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function leaveInfo(it){
  if (!it || !it.day) return null;
  const st = parseHM(it.start), lv = parseHM(it.leave);
  if (it.clear) return null;
  const start = st ? atDay(it.day, st) : null;
  let leave = null;
  if (st && it.drive_min != null) leave = new Date(start.getTime() - (+it.drive_min + +S.leave.buffer) * MIN);
  else if (lv) leave = atDay(it.day, lv);
  else if (st) leave = new Date(start.getTime() - S.leave.buffer * MIN);
  if (!leave) return null;
  const cut = parseHM(S.leave.cutoff) || [10, 0];
  const ref = start || leave;
  if (ref.getHours() * 60 + ref.getMinutes() > cut[0] * 60 + cut[1]) return null;   // later events don't count
  return { leave, start, event: it.event || '', location: it.location || '', src: it.src || 'muse' };
}
function nextLeave(now = Date.now()){
  const byDay = {};
  for (const it of LV.items || []) byDay[it.day] = { ...it, src:'muse' };
  for (const it of LV.manual || []) byDay[it.day] = { ...it, src:'manual' };   // manual wins for the same day
  let best = null;
  for (const it of Object.values(byDay)){
    const L = leaveInfo(it); if (!L) continue;
    if (L.leave.getTime() < now - 20*MIN || L.leave.getTime() > now + 36*HOUR) continue;
    if (!best || L.leave < best.leave) best = L;
  }
  return best;
}
function leaveLine(now = Date.now()){
  const L = nextLeave(now); if (!L) return null;
  const soon = L.leave - now < 15*MIN;
  const past = L.leave <= now;
  const when = L.leave - now > 20*HOUR ? ' ' + DAYN[L.leave.getDay()] : '';
  return { soon, html:`${ic('car')}Leave by ${esc(fmtD(L.leave))}${when}${L.event ? ' for ' + esc(L.event) : ''} <span class="in">· ${past ? 'now' : untilText(L.leave, now)}</span>` };
}
async function fetchLeave(force){
  if (!S.leave.key) return;
  if (!force && Date.now() - LV.fetchedAt < 10*MIN) return;
  try {
    const r = await fetch('api/leave', { headers:{ 'x-dusk-key': S.leave.key }, cache:'no-store' });
    if (r.status === 401){ LV.error = 'Key not accepted'; }
    else if (!r.ok){ LV.error = 'Server error ' + r.status; }
    else { const j = await r.json(); LV.items = j.items || []; LV.error = ''; LV.lastUpdate = j.items && j.items.length ? j.items.map(i => i.updated_at || '').sort().pop() : ''; }
    LV.fetchedAt = Date.now();
  } catch(e){ LV.error = 'Offline'; }
  saveLeave(); render(); if (sheetOpen()) redraw();
}

/* ---------- look (CSS vars from settings) ---------- */
const FONTS = {
  rounded:{ name:'Rounded', css:'ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif' },
  classic:{ name:'Classic', css:'-apple-system,"SF Pro Display",BlinkMacSystemFont,system-ui,sans-serif' },
  serif:{ name:'Serif', css:'"New York",ui-serif,Georgia,serif' },
  mono:{ name:'Mono', css:'ui-monospace,"SF Mono",Menlo,monospace' }
};
const GRADS = {
  dusk:['Dusk','#1c1f4f','#583e70','#d9835e'], ocean:['Ocean','#06142e','#0f3a5c','#2a7a8c'], ember:['Ember','#1a0b0b','#4a1a1a','#b5542a'],
  forest:['Forest','#06120d','#12352a','#4f7a5a'], graphite:['Graphite','#0b0c10','#1a1c22','#2c2f38'], plum:['Plum','#120a1c','#36204f','#7a4f8f']
};
const NCOLORS = [['Red','#ff3b30'],['Amber','#ff9f0a'],['Warm white','#f3e6d4'],['Moon','#b9a8ff'],['Green','#4fd18b']];
const DCOLORS = [['White','#f6f4ff'],['Warm','#ffe6cf'],['Moon','#d8ccff'],['Peach','#ffb27d'],['Mint','#bff3dc']];
const DRIFT = { off:[0, 0], subtle:[.02, .03], normal:[.05, .07] };
let photoURL = '';
function applyLook(){
  const r = document.documentElement.style, d = S.day, n = S.night;
  r.setProperty('--d-font', (FONTS[d.font] || FONTS.rounded).css);
  r.setProperty('--d-weight', d.weight);
  r.setProperty('--d-scale', (d.size / 100).toFixed(2));
  r.setProperty('--d-color', d.color);
  r.setProperty('--d-shift', { high:'-16vh', center:'-4vh', low:'12vh' }[d.pos] || '-4vh');
  r.setProperty('--d-shift-mini', { high:'-16cqh', center:'-4cqh', low:'12cqh' }[d.pos] || '-4cqh');
  r.setProperty('--d-align', d.align === 'left' ? 'flex-start' : 'center');
  r.setProperty('--n-font', (FONTS[n.font] || FONTS.rounded).css);
  r.setProperty('--n-weight', n.weight);
  r.setProperty('--n-scale', (n.size / 100).toFixed(2));
  r.setProperty('--night', n.color);
  r.setProperty('--dim', (n.dim / 100).toFixed(2));
  r.setProperty('--peek', Math.min(0.85, n.dim / 100 * 2.4 + 0.1).toFixed(2));
  $('#dDate').classList.toggle('hidden', !d.showDate);
  paintWall($('#wall'));
}
function wallHTML(){
  const d = S.day;
  if (d.wall === 'photo' && photoURL)
    return `<div class="layer photo" style="background-image:url('${photoURL}');filter:blur(${d.blur}px)"></div><div class="layer shade" style="opacity:${d.dim / 100}"></div>`;
  if (d.wall === 'grad'){ const g = GRADS[d.grad] || GRADS.dusk; return `<div class="layer" style="background:linear-gradient(180deg,${g[1]} 0%,${g[2]} 58%,${g[3]} 100%)"></div>`; }
  if (d.wall === 'solid') return `<div class="layer" style="background:${esc(d.solid)}"></div>`;
  return `<div class="layer sky"></div>${d.stars ? '<div class="layer stars"></div>' : ''}`;
}
function paintWall(el){ const h = wallHTML(); if (el._h !== h){ el.innerHTML = h; el._h = h; } }

/* photo wallpaper lives in IndexedDB (too big for localStorage) */
function idb(){ return new Promise((ok, no) => { const r = indexedDB.open('dusk', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); }
async function idbGet(k){ try { const db = await idb(); return await new Promise(ok => { const q = db.transaction('files').objectStore('files').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); }); } catch(e){ return null; } }
async function idbSet(k, v){ const db = await idb(); return new Promise((ok, no) => { const t = db.transaction('files', 'readwrite'); t.objectStore('files').put(v, k); t.oncomplete = ok; t.onerror = () => no(t.error); }); }
async function loadPhoto(){ const b = await idbGet('wall'); if (b){ if (photoURL) URL.revokeObjectURL(photoURL); photoURL = URL.createObjectURL(b); } applyLook(); }
async function savePhoto(file){
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); });
  const max = 2752, k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', .86));
  await idbSet('wall', blob); S.day.wall = 'photo'; saveSettings(); await loadPhoto();
}

/* ---------- sky ---------- */
const SKY = [
  [0,   '#070a1c','#0d1230','#1b1a3e','#2a2350',.45, 1],
  [5.5, '#0b1030','#1c2350','#4a3a6a','#b0607a',.45, .8],
  [7,   '#1f2c5c','#5a5f8e','#d8957a','#ffb38a',.6,  0],
  [10,  '#1b3a69','#3d6493','#86a7c9','#d6e4f2',.35, 0],
  [16,  '#1b3866','#456896','#a2b4cb','#ecd6b4',.4,  0],
  [18.5,'#1c1f4f','#583e70','#d9835e','#ffa66b',.65, 0],
  [20.5,'#0e1235','#2a2252','#6b3f5e','#c0607a',.55, .6],
  [22.5,'#080b20','#121638','#241e45','#3a2a5a',.45, 1],
  [24,  '#070a1c','#0d1230','#1b1a3e','#2a2350',.45, 1]
];
const hex = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const x = hex(a), y = hex(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
function applySky(d = new Date()){
  const h = d.getHours() + d.getMinutes() / 60;
  let i = 0; while (i < SKY.length - 2 && SKY[i + 1][0] <= h) i++;
  const A = SKY[i], B = SKY[i + 1], t = (h - A[0]) / (B[0] - A[0]);
  const st = document.documentElement.style, g = hex(mix(A[4], B[4], t)), ga = A[5] + (B[5] - A[5]) * t;
  st.setProperty('--sky-top', mix(A[1], B[1], t)); st.setProperty('--sky-mid', mix(A[2], B[2], t)); st.setProperty('--sky-low', mix(A[3], B[3], t));
  st.setProperty('--glow', `rgba(${g.join(',')},${ga.toFixed(2)})`); st.setProperty('--stars', (A[6] + (B[6] - A[6]) * t).toFixed(2));
}

/* ---------- rendering ---------- */
function show(id){ for (const s of ['day','night','ring']) $('#' + s).classList.toggle('hidden', s !== id); document.documentElement.setAttribute('data-screen', id); }
function renderMode(){ show(ringing ? 'ring' : ST.mode); render(); }
let lastMin = -1;
function render(){
  const now = new Date();
  $('#dDate').textContent = now.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
  const c = clockHTML(now);
  $('#dClock').innerHTML = c; $('#nClock').innerHTML = c; $('#rClock').innerHTML = c;
  const al = alarmLine(now.getTime());
  const d = $('#dAlarm'); d.innerHTML = al.html; d.classList.toggle('none', al.none); d.classList.toggle('hidden', !S.day.showAlarm);
  const na = $('#nAlarm'); na.innerHTML = al.html; na.classList.toggle('hidden', !S.night.showAlarm);
  const lv = leaveLine(now.getTime());
  const dl = $('#dLeave'), nl = $('#nLeave');
  dl.classList.toggle('hidden', !lv || !S.day.showLeave); nl.classList.toggle('hidden', !lv || !S.night.showLeave);
  if (lv){ dl.innerHTML = lv.html; nl.innerHTML = lv.html; dl.classList.toggle('soon', lv.soon); }
  const sl = SLEEP[S.sleep] || SLEEP.off;
  const sb = document.querySelector('[data-act=sleeppick] .disc'); sb.innerHTML = ic(sl.icon); $('#sleepLbl').textContent = sl.name;
  applySky(now);
  renderArm();
  if (sheetOpen() && page().id === 'home') drawMini();
}
function renderArm(){

const MAX_LOOP = 150;
function makeLoop(ctx, buf, xf){
  const sr = buf.sampleRate, n = Math.min(buf.length, Math.floor(MAX_LOOP * sr));
  const X = Math.min(Math.floor(xf * sr), Math.floor(n / 3));
  const out = ctx.createBuffer(1, n - X, sr), o = out.getChannelData(0);
  const ch = []; for (let c = 0; c < buf.numberOfChannels; c++) ch.push(buf.getChannelData(c));
  const at = i => { let s = 0; for (const d of ch) s += d[i]; return s / ch.length; };
  for (let j = 0; j < n - X; j++){
    if (j < X){ const p = j / X; o[j] = at(j) * Math.sin(p * Math.PI / 2) + at(n - X + j) * Math.cos(p * Math.PI / 2); }
    else o[j] = at(j);
  }
  return out;
}
function synthSleep(ctx, name){
  const sr = 22050, secs = 40, n = sr * secs, raw = new Float32Array(n + sr * 4);
  let b0 = 0, b1 = 0, b2 = 0, br = 0, lp = 0, lp2 = 0;
  const env = new Float32Array(raw.length).fill(1);
  if (name === 'waves'){ let t = 0; env.fill(0.12);
    while (t < raw.length){ const len = Math.floor(sr * (7 + Math.random() * 4)), peak = .6 + Math.random() * .4;
      for (let i = 0; i < len && t + i < raw.length; i++){ const p = i / len; env[t + i] = .12 + peak * Math.pow(Math.sin(Math.PI * Math.min(1, p * 1.25)), 2) * (p < .8 ? 1 : (1 - p) * 5); }
      t += len; } }
  const thunder = []; if (name === 'thunder') for (let k = 0; k < 2; k++) thunder.push(Math.floor(sr * (6 + k * 19 + Math.random() * 6)));
  for (let i = 0; i < raw.length; i++){
    const w = Math.random() * 2 - 1;
    b0 = .99765 * b0 + w * .099; b1 = .963 * b1 + w * .2965; b2 = .57 * b2 + w * 1.0527;
    const pink = (b0 + b1 + b2 + w * .1848) * .16; br = (br + .02 * w) / 1.02;
    let v;
    if (name === 'waves'){ lp += (.18 + env[i] * .35) * ((pink * .8 + br * 2.5) - lp); v = lp * env[i] * 1.1; }
    else { lp2 += .35 * (pink - lp2); v = lp2 * .7; if (Math.random() < .0009) v += (Math.random() * 2 - 1) * .35;
      for (const s of thunder){ const k = i - s; if (k > 0 && k < sr * 6){ const e = Math.min(1, k / (sr * .4)) * Math.exp(-k / (sr * 1.6)); v += br * 9 * e; } } }
    raw[i] = v;

  const out = ctx.createBuffer(1, n, sr), o = out.getChannelData(0), X = sr * 4;
  for (let j = 0; j < n; j++){ if (j < X){ const p = j / X; o[j] = raw[j] * Math.sin(p * Math.PI / 2) + raw[n + j] * Math.cos(p * Math.PI / 2); } else o[j] = raw[j]; }
  return out;
}
const loading = {};
async function sleepBuffer(name){
  if (A.bufs[name]) return A.bufs[name];
  if (loading[name]) return loading[name];
  return loading[name] = (async () => {
    let buf = null;
    try {
      const r = await fetch(`sounds/${name}.mp3`);
      if (!r.ok) throw new Error(r.status);
      const ab = await r.arrayBuffer();
      const dec = await new Promise((ok, no) => { const p = A.ctx.decodeAudioData(ab, ok, no); if (p && p.catch) p.catch(no); });
      buf = makeLoop(A.ctx, dec, 3); A.srcKind[name] = 'file';
    } catch(e){ buf = synthSleep(A.ctx, name); A.srcKind[name] = 'built-in'; }
    for (const k of Object.keys(A.bufs)) if (k !== name) delete A.bufs[k];
    A.bufs[name] = buf; delete loading[name];
    if (sheetOpen()) redraw();
    return buf;
  })();
}
/* tone: Warm softens the hiss at the top end, which is what made rain read as "static" */
const TONES = { warm:{ name:'Warm', lp:4200, shelf:-6 }, natural:{ name:'Natural', lp:16000, shelf:0 }, soft:{ name:'Extra soft', lp:2400, shelf:-9 } };
function sleepChain(src, level, fadeIn){
  const ctx = A.ctx, t = ctx.currentTime, T = TONES[S.sleepTone] || TONES.warm;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = T.lp; lp.Q.value = .5;
  const hs = ctx.createBiquadFilter(); hs.type = 'highshelf'; hs.frequency.value = 2500; hs.gain.value = T.shelf;

}
function retone(){
  const T = TONES[S.sleepTone] || TONES.warm, t = A.ctx && A.ctx.currentTime;
  for (const s of [A.sleep, A.preview && A.preview.kind === 'sleep' ? A.preview : null]) if (s && s.lp){ s.lp.frequency.setTargetAtTime(T.lp, t, .1); s.hs.gain.setTargetAtTime(T.shelf, t, .1); }

const sleepLevel = () => vol(S.sleepVol) * .8;
let sleepToken = 0;
async function startSleep(fadeIn = S.sleepFadeIn){

  if (A.sleep && A.sleep.name === S.sleep && !A.sleep.stopping) return;
  const tok = ++sleepToken, name = S.sleep;

      const beat = B / 4, run = [...ch.slice(1).map(m => m + 12), ...ch.slice(1).map(m => m + 24)];
      I.pad(ctx, b, t, ch.slice(1), B, .7, 1); I.sub(ctx, b, t, ch[0], B * .9, .85); I.air(ctx, b, t, B, .6);
      run.forEach((m, i) => I.pluck(ctx, b, t + i * beat / 4, m, .4 + i * .03, (i / run.length - .5) * 1.2, .35, .15));
      I.bell(ctx, b, t + 3 * beat, run[run.length - 1], .45, .3);
      ch.slice(2).forEach(m => I.epiano(ctx, b, t + 2 * beat, m + 12, .35, beat * 1.5, 0, .4));
    } }
};
/* play a composition: fade = seconds to full volume */
function playComp(key, { fade = 0, level = vol(S.alarmVol), ctx = A.ctx, dest = A.alarmOut, offline = 0 } = {}){
  if (!ctx) return null;
  const C = COMPS[key] || COMPS.sunrise, B = 240 / C.bpm, t0 = ctx.currentTime + .08;
  level *= Math.pow(10, (C.gain || 0) / 20);   // makeup gain so every sound peaks near full scale
  const bus = makeBus(ctx, dest, C.delay);
  if (fade > 0){
    const n = 256, curve = new Float32Array(n);
    for (let i = 0; i < n; i++){ const p = i / (n - 1); curve[i] = level * (0.012 + 0.988 * p * p); }
    bus.master.gain.setValueCurveAtTime(curve, t0, fade);
  } else bus.master.gain.setValueAtTime(level, t0);
  let bar = 0, next = t0, timer = null;
  const h = { key, stopped:false, bus, stop(fadeOut = .3){
    if (h.stopped) return; h.stopped = true; clearInterval(timer);
    const t = ctx.currentTime;
    try { bus.master.gain.cancelScheduledValues(t); bus.master.gain.setValueAtTime(bus.master.gain.value, t); bus.master.gain.linearRampToValueAtTime(0, t + fadeOut); } catch(e){}
    setTimeout(() => { for (const nd of bus.nodes) try { nd.disconnect(); } catch(e){} }, (fadeOut + 6) * 1000);
  }, setLevel(l){ const t = ctx.currentTime; bus.master.gain.cancelScheduledValues(t); bus.master.gain.setTargetAtTime(l, t, .08); } };
  const sched = (ahead) => {
    if (h.stopped) return;
    if (!offline && ctx.state !== 'running') ctx.resume().catch(() => {});
    while (next < ctx.currentTime + ahead){
      const ci = Math.floor(bar / C.cb) % C.prog.length;
      C.bar(ctx, bus, next, bar, C.prog[ci], B, bar % C.cb === 0);
      bar++; next += B;
    }
  };
  if (offline) sched(offline);
  else { sched(3); timer = setInterval(() => sched(3), 400); }
  return h;
}

/* ----- previews ----- */
let previewT = null, volT = null;
function stopPreview(){
  clearTimeout(previewT);
  const p = A.preview; A.preview = null;
  if (!p) return;
  if (p.kind === 'alarm') p.h.stop(.4);
  else if (p.g){ const t = A.ctx.currentTime; try { p.g.gain.cancelScheduledValues(t); p.g.gain.setValueAtTime(p.g.gain.value, t); p.g.gain.linearRampToValueAtTime(0.0001, t + .6); p.src.stop(t + .7); } catch(e){} }
}
function previewAlarm(key, secs = 10){
  const same = A.preview && A.preview.key === key && secs > 4; stopPreview();
  if (!same){ arm(); const h = playComp(key, { fade:0 }); if (h){ A.preview = { kind:'alarm', key, h }; previewT = setTimeout(() => { stopPreview(); redraw(); }, secs * 1000); } }
  redraw();
}
async function previewSleep(secs = 10){
  const same = A.preview && A.preview.kind === 'sleep' && secs > 4; stopPreview();
  if (same || S.sleep === 'off'){ redraw(); return; }
  arm(); if (!A.ctx) return;
  const key = 'sleep:' + S.sleep; A.preview = { kind:'sleep', key }; redraw();
  const buf = await sleepBuffer(S.sleep);
  if (!A.preview || A.preview.key !== key) return;
  const src = A.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
  const ch = sleepChain(src, sleepLevel(), .4);
  src.start(A.ctx.currentTime, Math.random() * Math.max(0, buf.duration - 12));

}

/* =====================================================================
   RINGING
   ===================================================================== */
let ringTimeout = null, handoffT = null;
function startRing(src){
  stopPreview();
  ringing = { label: src.label || 'Alarm', gentle: !!src.gentle, test: !!src.test, at: Date.now(), hadSleep: !!A.sleep };
  closeSheet(true); hideCtrls();
  $('#rLabel').textContent = ringing.label;
  $('#btnSnooze').textContent = `Snooze ${S.snooze} min`;
  renderMode(); arm();
  const r = ringing;
  const wait = A.sleep ? stopSleep(5) : 0;
  clearTimeout(handoffT);
  handoffT = setTimeout(() => {
    if (ringing !== r) return;
    const key = r.gentle ? S.gentleSound : S.standardSound;
    const fade = r.test ? 15 : r.gentle ? S.fade * 60 : 20;
    if (A.alarm) A.alarm.stop();
    A.alarm = playComp(key, { fade }); r.alarmAt = Date.now();
  }, wait * 1000);
  clearTimeout(ringTimeout);
  ringTimeout = setTimeout(() => { if (ringing === r) doSnooze(); }, S.autoSnooze * MIN);
}
function endRing(){ clearTimeout(handoffT); clearTimeout(ringTimeout); if (A.alarm){ A.alarm.stop(.5); A.alarm = null; } }
function doStop(){
  endRing(); const wasTest = ringing && ringing.test;
  ringing = null; ST.snooze = null;
  if (!wasTest) ST.mode = 'day'; else if (ST.mode === 'night') startSleep(4);
  saveState(); renderMode();
}
function doSnooze(){
  endRing();
  const r = ringing || { label:'Alarm', gentle:false };
  ST.snooze = { at: Date.now() + S.snooze * MIN, label: r.label, gentle: r.gentle };
  ST.mode = 'night'; ringing = null; saveState(); renderMode(); drift();
}

/* ---------- tick ---------- */
function due(now){
  const from = ST.lastCheck;
  if (ST.snooze && ST.snooze.at <= now){ const s = ST.snooze; ST.snooze = null; if (now - s.at < 15*MIN) return { label:s.label, gentle:s.gentle }; }
  let hit = null;
  for (const a of alarms){
    if (!a.on) continue;
    const t = occurrenceAfter(a, from);
    if (!t || t.getTime() > now) continue;
    if (!a.days.length) a.on = false;
    if (now - t.getTime() < 15*MIN && a.ring !== false && !hit) hit = { label:a.label || 'Alarm', gentle:a.gentle !== false };
  }
  return hit;
}
let lastSave = 0;
function tick(){
  const now = Date.now();
  if (!ringing){
    const before = JSON.stringify(alarms), hit = due(now);
    ST.lastCheck = now;
    if (JSON.stringify(alarms) !== before){ saveAlarms(); if (sheetOpen()) redraw(); }
    if (hit){ saveState(); startRing(hit); }
  } else ST.lastCheck = now;
  if (now - lastSave > 15000){ lastSave = now; saveState(); }
  const d = new Date(now);
  if (d.getMinutes() !== lastMin){
    lastMin = d.getMinutes(); render();
    if (!ringing) drift();
    if (d.getMinutes() % 10 === 0) fetchLeave();
  }
}

/* ---------- wake lock ---------- */
let wl = null;
async function keepAwake(){
  if (wl || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
  try { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } catch(e){ wl = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible'){ keepAwake(); if (A.ctx && A.ctx.state !== 'running') A.ctx.resume().catch(() => {}); render(); checkUpdate(); fetchLeave(); }
});

        ${d.wall === 'photo' ? `<div class="row"><div class="rt">${photoURL ? 'Change photo' : 'Choose a photo'}</div><label class="chip on" style="display:flex;align-items:center;cursor:pointer">${ic('photo')}&nbsp;Choose<input type="file" accept="image/*" data-file="wall" hidden></label></div>
          ${range('day.dim', d.dim, 0, 85, 'Darken', d.dim + '%', 5)}${range('day.blur', d.blur, 0, 30, 'Blur', d.blur + ' px')}` : ''}
      </div>` };
  },

  night(){
    const n = S.night, f = fmt(new Date().getHours(), new Date().getMinutes());
    return { title:'Night mode', html:`
      <div class="nprev" style="margin-top:8px"><span>${f.hm}</span></div>
      <div class="glabel">Look</div>
      <div class="group">
        <div class="row"><div class="rt">Color</div><div class="chips">${NCOLORS.map(([nm, c]) => `<button class="swatch ${n.color === c ? 'on' : ''}" style="background:${c}" data-act="ncolor" data-v="${c}" aria-label="${nm}"></button>`).join('')}<input type="color" class="colorin" data-color="night.color" value="${n.color}" aria-label="Custom color"></div></div>
        ${range('night.dim', n.dim, 3, 70, 'Brightness', n.dim + '%')}
        <div class="row col"><div class="rt">Font</div><div class="chips">${Object.entries(FONTS).map(([k, ft]) => chip('nfont', k, `<span style="font-family:${ft.css.replace(/"/g, '&quot;')}">${ft.name}</span>`, n.font === k)).join('')}</div></div>
        ${range('night.weight', n.weight, 100, 800, 'Thickness', n.weight, 100)}
        ${range('night.size', n.size, 50, 135, 'Size', n.size + '%', 5)}
        <div class="row"><div class="rt">Show next alarm</div>${sw('night.showAlarm', n.showAlarm, 'Show next alarm')}</div>
        <div class="row"><div class="rt">Show leave by</div>${sw('night.showLeave', n.showLeave, 'Show leave by')}</div>
      </div>
      <div class="ghelp">A web page can't lower the real screen brightness. For extra dark: Settings → Accessibility → Display &amp; Text Size → Reduce White Point.</div>
      <div class="glabel">Tap to peek</div>
      <div class="group"><div class="row"><div><div class="rt">Peek lasts</div><div class="rs">Tap the screen at night: brighter for this long, with Good morning and ✕</div></div>${stepper('night.peekSecs', n.peekSecs, 's')}</div></div>
      <div class="glabel">Burn-in protection</div>
      <div class="group"><div class="row col"><div class="chips">${chip('drift', 'off', 'Off', S.drift === 'off')}${chip('drift', 'subtle', 'Subtle', S.drift === 'subtle')}${chip('drift', 'normal', 'Normal', S.drift === 'normal')}</div>
        <div class="rs">The clock shifts a few pixels once a minute so the same pixels aren't lit all night. That's the movement you noticed. iPad Pro screens are OLED, so leaving this on is safer. Applies to the home screen too (half as much).</div></div></div>` };
  },

  leave(){
    const L = nextLeave(), url = location.origin + location.pathname.replace(/[^/]*$/, '') + 'api/leave', key = S.leave.key || '<your Dusk key>';
    const muse = `Every night at 9:00 PM, check my Google Calendar for tomorrow. Find the first event with a location that starts before ${fmtText(...(parseHM(S.leave.cutoff) || [10,0]))}. Estimate the drive time from home in Fenton, MI to that location at that time of day with normal traffic. Then send a POST request to ${url} with the header "x-dusk-key: ${key}" and a JSON body like {"day":"YYYY-MM-DD","event":"<event name>","location":"<address>","start":"HH:MM","drive_min":<minutes>} using 24-hour time. If there's no such event, send {"day":"YYYY-MM-DD","clear":true}.`;
    const man = (LV.manual || []).filter(m => m.day >= todayStr());
    return { title:'Leave by', html:`
      <div class="group" style="margin-top:8px"><div class="row"><div><div class="rt">${L ? `Leave by ${fmtD(L.leave)}` : 'Nothing coming up'}</div><div class="rs">${L ? `${esc(L.event || 'Event')}${L.start ? ' at ' + fmtD(L.start) : ''} · from ${L.src === 'manual' ? 'you' : 'Muse'}` : 'Shows the next morning event before your cutoff'}</div></div></div></div>
      <div class="glabel">Rules</div>
      <div class="group">
        <div class="row"><div><div class="rt">Buffer</div><div class="rs">Extra time added on top of the drive</div></div>${stepper('leave.buffer', S.leave.buffer, 'min')}</div>
        <div class="row"><div><div class="rt">Only events before</div><div class="rs">Later events don't count, you'll already be up</div></div><input type="time" class="txt" style="width:auto" data-time="leave.cutoff" value="${S.leave.cutoff}"></div>
      </div>
      <div class="ghelp">Leave time = event start − drive − buffer.</div>
      <div class="glabel">Muse connection</div>
      <div class="group">
        <div class="row col"><div class="rt">Dusk key</div><input class="txt" id="keyIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste the DUSK_KEY you set in Vercel" value="${esc(S.leave.key)}">
          <button class="wide" data-act="savekey">Save key and check</button>
          <div class="rs">${!S.leave.key ? 'Not connected yet.' : LV.error ? `<span class="bad">${esc(LV.error)}</span>` : `<span class="ok">Connected.</span> ${LV.lastUpdate ? 'Muse last sent ' + new Date(LV.lastUpdate).toLocaleString(undefined, { weekday:'short', hour:'numeric', minute:'2-digit' }) + '.' : 'Nothing from Muse yet.'}`}</div></div>
        <div class="row col"><div class="rt">Instructions for Muse</div><div class="code" id="museText">${esc(muse)}</div><button class="wide" data-act="copymuse">Copy for Muse</button></div>
      </div>
      <div class="glabel">Add one yourself</div>
      <div class="group">
        <div class="row col"><input class="txt" id="mEvent" placeholder="Event, e.g. INC Systems" maxlength="60">
          <div class="fieldrow"><input type="date" class="txt" id="mDay" value="${todayStr(new Date(Date.now() + 86400000))}" aria-label="Day"><input type="time" class="txt" id="mStart" value="08:30" aria-label="Start time"></div>
          <div class="row" style="padding:0;min-height:0"><span class="rt">Drive</span>${stepper('mDrive', 25, 'min')}</div>
          <button class="wide" data-act="addmanual">Add</button></div>
        ${man.map(m => `<div class="row"><div><div class="rt">${esc(m.event || 'Event')}</div><div class="rs">${new Date(m.day + 'T12:00').toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' })} · starts ${fmtText(...parseHM(m.start))} · ${m.drive_min} min drive</div></div><button class="chip" data-act="delmanual" data-v="${m.day}">Remove</button></div>`).join('')}
      </div>
      <div class="ghelp">One you add here wins over Muse's for the same day.</div>` };
  },

  status(){
    const C = runChecksSync();
    return { title:'Status', html:`
      <div class="ghelp" style="margin-top:6px">Green means set up right. Check this before bed for the first few nights.</div>
      <div class="group" style="margin-top:12px">${C.map(c => `<div class="st"><span class="status-dot" style="background:${c.s === 'ok' ? 'var(--good)' : c.s === 'warn' ? 'var(--warn)' : c.s === 'bad' ? 'var(--bad)' : 'rgba(255,255,255,.25)'}"></span>
        <div class="t"><b>${c.name}</b><p>${c.why}</p></div><div class="v ${c.s === 'ok' ? 'ok' : c.s === 'info' ? 'dim' : c.s}">${c.val}</div></div>`).join('')}</div>
      <button class="wide mt" data-act="test">Test alarm now</button>
      <div class="ghelp">The test is the only way to confirm the volume you'll actually hear.</div>` };
  },

  about(){
    return { title:'How Dusk works', html:`
      <div class="group" style="margin-top:8px">
        <div class="row"><div><div class="rt">Good night</div><div class="rs">Turns the screen black with a dim clock and starts your sleep sound. The sound plays until the alarm, then fades out and the alarm fades in.</div></div></div>
        <div class="row"><div><div class="rt">Tap at night</div><div class="rs">Brightens the clock for a few seconds. Shows Good morning and ✕. ✕ goes straight back to dark.</div></div></div>
        <div class="row"><div><div class="rt">Good morning</div><div class="rs">Leaves night mode early and stops the sleep sound. Your alarms stay set; if one is still coming, it rings on the home screen.</div></div></div>
        <div class="row"><div><div class="rt">Snooze</div><div class="rs">Back to night mode, quiet (no sleep sound), until it rings again after ${S.snooze} min.</div></div></div>
        <div class="row"><div><div class="rt">Stop</div><div class="rs">Ends the alarm and goes to the home screen.</div></div></div>
      </div>
      <div class="glabel">Limits</div>
      <div class="group">
        <div class="row"><div><div class="rt">Only rings while open</div><div class="rs">Web apps can't run in the background. If you switch apps, close Dusk, or the iPad locks, the alarm won't go off. Keep Auto-Lock on Never and Dusk on screen. Keep your phone alarm as a backup the first week.</div></div></div>
        <div class="row"><div><div class="rt">Silent mode</div><div class="rs">Dusk plays as media, so the silent setting shouldn't mute it. The iPad's media volume is what counts.</div></div></div>
        <div class="row"><div><div class="rt">Your phone's alarms</div><div class="rs">No web app can read the iPhone Clock app. Alarms live in Dusk; use a Silent alarm here to mirror one.</div></div></div>
      </div>
      <div class="ver">Version ${APP_VERSION}</div>` };
  }
};
PAGES.settings.title = 'Settings'; PAGES.alarms.title = 'Alarms'; PAGES.sounds.title = 'Alarm sounds'; PAGES.sleep.title = 'Sleep sounds';
PAGES.home.title = 'Home screen'; PAGES.night.title = 'Night mode'; PAGES.leave.title = 'Leave by'; PAGES.status.title = 'Status'; PAGES.about.title = 'How Dusk works'; PAGES.edit.title = 'Alarm';

function drawMini(){
  const w = $('#miniWall'); if (!w) return;
  paintWall(w);
  const now = new Date();
  $('#mDate').textContent = S.day.showDate ? now.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' }) : '';
  $('#mClock').innerHTML = clockHTML(now);
  const al = alarmLine(now.getTime()); $('#mLine').innerHTML = S.day.showAlarm ? al.html : '';
}

/* ---------- status checks ---------- */
let soundCheck = {};
async function runChecks(){
  for (const k of ['waves', 'rain', 'thunder']){
    try { const r = await fetch(`sounds/${k}.mp3`, { method:'HEAD', cache:'no-store' }); soundCheck[k] = r.ok; } catch(e){ soundCheck[k] = null; }
  }
  checkUpdate(true).then(() => { if (sheetOpen() && page().id === 'status') redraw(); });
  if (sheetOpen() && page().id === 'status') redraw();
}
function runChecksSync(){
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const n = nextAlarm(), ringSoon = n && n.a.ring !== false && n.t - Date.now() < 24*HOUR;
  const L = nextLeave();
  const C = [];
  C.push({ name:'Opened from Home Screen', why:'Fills the whole screen with no Safari bars, and lets Dusk keep the screen on.', s: standalone ? 'ok' : 'warn', val: standalone ? 'Yes' : 'In Safari' });
  C.push({ name:'Screen stays awake', why:'If the screen sleeps, Dusk pauses and the alarm can\'t ring. Backup: Auto-Lock → Never.', s: wl ? 'ok' : 'warn', val: !('wakeLock' in navigator) ? 'Use Auto-Lock' : wl ? 'On' : 'Tap screen' });
  C.push({ name:'Alarm audio armed', why:'Safari only allows sound after a tap. One tap after opening Dusk arms it for the night.', s: armed() ? 'ok' : 'warn', val: armed() ? 'Armed' : 'Tap screen' });
  C.push({ name:'Next alarm', why:'The next alarm that will actually ring on this iPad.', s: ringSoon ? 'ok' : n ? 'info' : 'info', val: n ? `${fmtD(n.t)}${n.a.ring === false ? ' (silent)' : ''}` : 'None' });
  const files = ['waves', 'rain', 'thunder'].map(k => soundCheck[k]);
  const allFiles = files.every(Boolean), anyMissing = files.some(f => f === false);
  C.push({ name:'Sleep sound files', why:'Real recordings on the site. Missing files fall back to a generated stand-in that sounds like static.', s: allFiles ? 'ok' : anyMissing ? 'bad' : 'info', val: allFiles ? 'All 3 found' : anyMissing ? `Missing: ${['waves','rain','thunder'].filter((k, i) => files[i] === false).join(', ')}` : 'Checking…' });
  C.push({ name:'Internet', why:'Only needed for Leave by and updates. Alarms and sounds keep working offline once loaded.', s: navigator.onLine ? 'ok' : 'warn', val: navigator.onLine ? 'Online' : 'Offline' });
  C.push({ name:'Leave by', why:'Muse sends tomorrow morning\'s first event and drive time each night.', s: !S.leave.key ? 'info' : LV.error ? 'bad' : 'ok', val: !S.leave.key ? (L ? 'Manual only' : 'Not set up') : LV.error ? LV.error : L ? fmtD(L.leave) : 'Connected' });
  C.push({ name:'Up to date', why:'The iPad keeps an old version open forever. Reload when a new one is out.', s: !latest ? 'info' : latest === APP_VERSION ? 'ok' : 'warn', val: !latest ? APP_VERSION : latest === APP_VERSION ? APP_VERSION : 'Reload for ' + latest });
  C.push({ name:'Volume', why:'Web pages can\'t read the iPad volume. Use Test alarm now to hear what you\'ll get.', s:'info', val:'Test it' });
  return C;
}
function checkSummary(){ const C = runChecksSync(); return { bad: C.filter(c => c.s === 'warn' || c.s === 'bad').length }; }

/* ---------- home controls ---------- */
let ctrlT = null, hintShown = false;
function showCtrls(){ $('#ctrls').classList.add('show'); $('#hint').style.opacity = 0; clearTimeout(ctrlT); ctrlT = setTimeout(hideCtrls, 5000); }
function hideCtrls(){ $('#ctrls').classList.remove('show'); clearTimeout(ctrlT); }

/* =====================================================================
   EVENTS
   ===================================================================== */
let pressT = null, pressXY = null, longFired = false;
document.addEventListener('pointerdown', e => {
  arm(); keepAwake();
  if (ST.mode === 'night' && !ringing && !sheetOpen() && !e.target.closest('.peekbar')){
    const n = $('#night'); n.classList.add('peek');
    clearTimeout(n._t); n._t = setTimeout(() => n.classList.remove('peek'), S.night.peekSecs * 1000);
    if (!A.sleep && !ST.snooze) startSleep(4);
    renderArm();
  }
  if (ST.mode === 'day' && !ringing && !sheetOpen() && !e.target.closest('.ctrls, .update')){
    longFired = false; pressXY = [e.clientX, e.clientY];
    clearTimeout(pressT); pressT = setTimeout(() => { longFired = true; hideCtrls(); openSheet('home'); }, 650);
  }
}, { passive:true });
document.addEventListener('pointermove', e => { if (pressXY && Math.hypot(e.clientX - pressXY[0], e.clientY - pressXY[1]) > 12){ clearTimeout(pressT); pressXY = null; } }, { passive:true });
document.addEventListener('pointerup', e => {
  clearTimeout(pressT);
  if (pressXY && !longFired && ST.mode === 'day' && !ringing && !sheetOpen() && !e.target.closest('.ctrls, .update')){
    $('#ctrls').classList.contains('show') ? hideCtrls() : showCtrls();
  }
  pressXY = null;
}, { passive:true });

document.addEventListener('click', e => {
  if (e.target.closest('.sw') || e.target.closest('label.chip')) return;
  if (e.target === $('#sheet')){ if (page().id !== 'edit') closeSheet(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (el.closest('.ctrls')) showCtrls();
  switch (act){
    case 'alarms': openSheet('alarms'); break;
    case 'settings': openSheet('settings'); if (S.sleep !== 'off' && A.ctx) sleepBuffer(S.sleep); break;
    case 'customize': openSheet('home'); break;
    case 'push': push(v); if (v === 'sleep' && S.sleep !== 'off' && A.ctx) sleepBuffer(S.sleep); break;
    case 'back': pop(); break;
    case 'close': closeSheet(); break;
    case 'reload': location.reload(); break;
    case 'sleeppick': openSheet('sleep'); if (S.sleep !== 'off' && A.ctx) sleepBuffer(S.sleep); break;
    case 'night': hideCtrls(); ST.mode = 'night'; ST.snooze = null; saveState(); renderMode(); drift(); arm(); startSleep(); break;
    case 'morning': stopSleep(2); ST.mode = 'day'; ST.snooze = null; saveState(); $('#night').classList.remove('peek'); renderMode(); break;
    case 'unpeek': { const n = $('#night'); clearTimeout(n._t); n.classList.remove('peek'); break; }
    case 'stop': doStop(); break;
    case 'snooze': doSnooze(); break;
    case 'add':
      editing = { isNew:true, id: Date.now().toString(36), h:7, m:0, days:[], label:'', ring:true, gentle:true, on:true };
      stack.push({ id:'edit' }); dir = 'fwd'; redraw(true); break;
    case 'edit': {
      const a = alarms.find(x => x.id === el.dataset.id); if (!a) break;
      editing = { gentle:true, ...a, days:[...a.days], isNew:false }; stack.push({ id:'edit' }); dir = 'fwd'; redraw(true); break; }
    case 'ed-cancel': editing = null; pop(); break;
    case 'ed-day': { captureEd(); const i = +el.dataset.i; editing.days = editing.days.includes(i) ? editing.days.filter(x => x !== i) : [...editing.days, i]; redraw(); break; }
    case 'ed-save': {
      captureEd(); const { isNew, ...a } = editing; a.on = true;
      alarms = isNew ? [...alarms, a] : alarms.map(x => x.id === a.id ? a : x);
      editing = null; saveAlarms(); pop(); render();
      const t = occurrenceAfter(a, Date.now()); if (t) toast(`Alarm set for ${fmtText(a.h, a.m)} · ${untilText(t)}`);
      break; }
    case 'ed-del': alarms = alarms.filter(x => x.id !== editing.id); editing = null; saveAlarms(); pop(); render(); break;
    case 'gsound': if (e.target.closest('.play')) break; S.gentleSound = v; saveSettings(); previewAlarm(v); break;
    case 'ssound': if (e.target.closest('.play')) break; S.standardSound = v; saveSettings(); previewAlarm(v); break;
    case 'pv-alarm': previewAlarm(v); break;
    case 'sleep': if (e.target.closest('.play')) break; stopPreview(); S.sleep = v; saveSettings(); render(); if (v !== 'off'){ arm(); sleepBuffer(v); } redraw(); break;
    case 'pv-sleep': previewSleep(); break;
    case 'tone': S.sleepTone = v; saveSettings(); retone(); redraw(); break;
    case 'step': {
      const k = el.dataset.k, [mn, mx, st] = STEPS[k] || [1, 999, 1];
      if (k === 'mDrive'){ const inp = document.querySelector('[data-num=mDrive]'); inp.value = clamp(+inp.value + (+el.dataset.d) * 5, 0, 240); break; }
      setPath(k, clamp(getPath(k) + (+el.dataset.d) * st, mn, mx)); redraw(); render(); break; }
    case 'dfont': S.day.font = v; saveSettings(); applyLook(); redraw(); break;
    case 'nfont': S.night.font = v; saveSettings(); applyLook(); redraw(); break;
    case 'dpos': S.day.pos = v; saveSettings(); applyLook(); redraw(); break;
    case 'dalign': S.day.align = v; saveSettings(); applyLook(); redraw(); break;
    case 'dcolor': S.day.color = v; saveSettings(); applyLook(); redraw(); break;
    case 'ncolor': S.night.color = v; saveSettings(); applyLook(); redraw(); break;
    case 'wall': S.day.wall = v; saveSettings(); applyLook(); redraw(); break;
    case 'grad': S.day.grad = v; saveSettings(); applyLook(); redraw(); break;
    case 'drift': S.drift = v; saveSettings(); drift(); redraw(); break;
    case 'test': arm(); startRing({ label:'Test alarm', gentle:true, test:true }); break;
    case 'savekey': S.leave.key = $('#keyIn').value.trim(); saveSettings(); LV.error = ''; fetchLeave(true); redraw(); break;
    case 'copymuse': navigator.clipboard && navigator.clipboard.writeText($('#museText').textContent).then(() => toast('Copied. Paste it into Muse.'), () => toast('Select the text and copy it')); break;
    case 'addmanual': {
      const day = $('#mDay').value, start = $('#mStart').value, drive = +document.querySelector('[data-num=mDrive]').value;
      if (!day || !start){ toast('Pick a day and start time'); break; }
      LV.manual = (LV.manual || []).filter(m => m.day !== day && m.day >= todayStr());
      LV.manual.push({ day, start, drive_min: drive, event: $('#mEvent').value.trim() });
      saveLeave(); render(); redraw(); toast('Added'); break; }
    case 'delmanual': LV.manual = (LV.manual || []).filter(m => m.day !== v); saveLeave(); render(); redraw(); break;
  }
});
function captureEd(){
  if (!editing) return;
  const t = $('#edTime'), l = $('#edLabel');
  if (t && t.value){ const [h, m] = t.value.split(':').map(Number); editing.h = h; editing.m = m; }
  if (l) editing.label = l.value.trim();
}

document.addEventListener('change', e => {
  const t = e.target, d = t.dataset || {};
  if (d.sw){
    const k = d.sw, v = t.checked;
    if (k === 'ed-ring'){ captureEd(); editing.ring = v; }
    else if (k === 'ed-gentle'){ captureEd(); editing.gentle = v; redraw(); }
    else if (k.startsWith('al-')){ const a = alarms.find(x => x.id === k.slice(3)); if (a){ a.on = v; saveAlarms(); redraw(); render(); } }
    else { setPath(k, v); applyLook(); render(); redraw(); }
  }
  if (d.range && (d.range === 'sleepVol' || d.range === 'alarmVol')) volPreview(d.range);
  if (d.num && d.num !== 'mDrive'){ const [mn, mx] = STEPS[d.num] || [1, 999]; setPath(d.num, clamp(Math.round(+t.value || mn), mn, mx)); redraw(); render(); }
  if (d.time){ setPath(d.time, t.value || '10:00'); render(); redraw(); }
  if (d.file === 'wall' && t.files && t.files[0]){ toast('Saving photo…'); savePhoto(t.files[0]).then(() => { redraw(); toast('Wallpaper set'); }, () => toast('Couldn\'t read that photo')); }
});
document.addEventListener('input', e => {
  const d = e.target.dataset || {};
  if (d.range){
    const k = d.range, v = +e.target.value; setPath(k, v);
    const lab = document.getElementById('rv-' + k.replace('.', '-'));
    if (lab) lab.textContent = /size|Vol|dim/.test(k) ? v + '%' : k === 'day.blur' ? v + ' px' : v;
    applyLook();
    if (k === 'sleepVol'){ const t = A.ctx && A.ctx.currentTime; for (const s of [A.sleep, A.preview && A.preview.kind === 'sleep' ? A.preview : null]) if (s && s.g){ try { s.g.gain.cancelScheduledValues(t); s.g.gain.setTargetAtTime(sleepLevel(), t, .08); } catch(err){} } }
    if (k === 'alarmVol' && A.preview && A.preview.kind === 'alarm') A.preview.h.setLevel(vol(S.alarmVol));
    if (page().id === 'home') drawMini();
  }
  if (d.color){ setPath(d.color, e.target.value); applyLook(); if (page().id === 'home') drawMini(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOpen()) pop(); });
window.addEventListener('online', () => fetchLeave(true));

/* ---------- start ---------- */
paintIcons();
applyLook();
loadPhoto();
renderMode();
drift();
keepAwake();
tick();
setInterval(tick, 1000);
setInterval(() => { if (ST.mode === 'day' && !ringing) checkUpdate(); }, 5*MIN);
checkUpdate(); fetchLeave(true);
setTimeout(() => { $('#hint').style.opacity = 0; }, 8000);
window.__dusk = { S, ST, A, LV, get ringing(){ return ringing; }, get alarms(){ return alarms; }, set alarms(v){ alarms = v; }, tick, startRing, COMPS, playComp, I, makeBus };
</script>
