<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dusk">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Dusk</title>
<script>
/* Before first paint: if Dusk was left in night mode, start pure black (no flash of sky at 3am). */
(function(){
  try{
    var st = JSON.parse(localStorage.getItem('dusk_state') || '{}');
    var se = JSON.parse(localStorage.getItem('dusk_settings') || '{}');
    var c = { red:'#ff3b30', amber:'#ff9f0a', warm:'#f3e6d4' }[se.nightColor] || '#ff3b30';
    document.documentElement.style.setProperty('--night', c);
    if (st.mode === 'night') document.documentElement.setAttribute('data-screen', 'night');
  }catch(e){}
})();
</script>
<style>
/* ---------- Tokens (set once, used everywhere) ---------- */
:root{
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px;
  --r:26px; --r-sm:16px; --r-xs:10px;
  --accent:#ffb27d; --on-accent:#2b1608; --moon:#d8ccff;
  --ink:#f6f4ff; --ink2:rgba(246,244,255,.70); --ink3:rgba(246,244,255,.44);
  --glass:rgba(20,22,50,.30); --glass-hi:rgba(255,255,255,.12);
  --sheet:rgba(24,24,52,.62);
  --stroke:rgba(255,255,255,.17); --hair:rgba(255,255,255,.08);
  --gloss:inset 0 1px 0 rgba(255,255,255,.24);
  --drop:0 18px 44px -18px rgba(0,0,0,.65);
  --blur:blur(24px) saturate(170%);
  --ease:cubic-bezier(.32,.72,0,1); --fast:180ms; --med:340ms;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --good:#7fe0a8; --warn:#ffc46b; --bad:#ff7a6e;
  --night:#ff3b30; --dim:.18; --peek:.45;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  /* sky (updated by JS every minute) */
  --sky-top:#0e1235; --sky-mid:#2a2252; --sky-low:#6b3f5e; --glow:rgba(192,96,122,.55); --stars:0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--ink);overflow:hidden;
  font:16px/1.35 var(--font);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
html[data-screen="night"] #day{display:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l)}
.clock{font-family:var(--display);font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-.035em;line-height:.9;white-space:nowrap}
.clock .ap{font-family:var(--font);font-size:.17em;font-weight:500;letter-spacing:.04em;margin-left:.2em;vertical-align:.32em;opacity:.7}

/* ---------- Glass ---------- */
.glass{background:linear-gradient(180deg,var(--glass-hi),rgba(255,255,255,0) 60%),var(--glass);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--stroke);box-shadow:var(--gloss),var(--drop)}

/* ---------- Day: a sky that follows the real time of day ---------- */
#day{background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 58%,var(--sky-low) 100%);transition:background 2s}
#day::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 38% at 50% 108%,var(--glow),transparent 70%)}
#day::after{content:"";position:absolute;inset:0 0 35% 0;pointer-events:none;opacity:var(--stars);transition:opacity 2s;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 18%,#fff 60%,transparent),radial-gradient(1px 1px at 27% 9%,#fff 60%,transparent),
    radial-gradient(1.2px 1.2px at 41% 24%,#fff 60%,transparent),radial-gradient(1px 1px at 58% 12%,#fff 60%,transparent),
    radial-gradient(1.6px 1.6px at 73% 20%,#fff 60%,transparent),radial-gradient(1px 1px at 86% 8%,#fff 60%,transparent),
    radial-gradient(1.1px 1.1px at 92% 30%,#fff 60%,transparent),radial-gradient(1px 1px at 6% 36%,#fff 60%,transparent),
    radial-gradient(1.2px 1.2px at 34% 40%,#fff 60%,transparent),radial-gradient(1px 1px at 66% 34%,#fff 60%,transparent),
    radial-gradient(1px 1px at 50% 5%,#fff 60%,transparent),radial-gradient(1.3px 1.3px at 19% 52%,#fff 60%,transparent);
  opacity:calc(var(--stars) * .75)}
#day .face{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;margin-top:-6vh;
  text-shadow:0 2px 24px rgba(0,0,0,.25)}
#day .date{font-size:clamp(18px,2.3vw,28px);font-weight:500;color:var(--ink2);letter-spacing:.01em}
#day .clock{font-size:min(23vw,44vh);margin:.04em 0 .08em}
.aline{font-size:clamp(17px,2.2vw,26px);font-weight:500;display:flex;align-items:center;gap:.4em;color:var(--ink)}
.aline.none{color:var(--ink3)}
.aline .in{color:var(--ink2);font-weight:400}
.update{position:absolute;top:calc(18px + var(--safe-t));z-index:2;border-radius:999px;padding:9px 18px;font-size:15px;font-weight:600}

.dock{position:absolute;z-index:2;bottom:calc(26px + var(--safe-b));display:flex;align-items:center;gap:6px;
  padding:7px;border-radius:999px}
.dbtn{display:flex;align-items:center;gap:8px;min-height:58px;padding:0 22px;border-radius:999px;font-size:18px;font-weight:600;
  transition:transform var(--fast) var(--ease),background var(--fast)}
.dbtn:active{transform:scale(.95)}
.dbtn:hover{background:rgba(255,255,255,.07)}
.dbtn.primary{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0)),rgba(216,204,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3);color:#fff}
.dbtn.icon{width:58px;padding:0;justify-content:center;font-size:22px}
.dbtn .sub{font-weight:600;color:var(--ink)}
.sep{width:1px;height:28px;background:var(--hair)}

.pop{position:absolute;z-index:3;bottom:calc(108px + var(--safe-b));border-radius:var(--r);padding:14px;
  display:flex;flex-direction:column;gap:10px;animation:rise var(--med) var(--ease)}
.pop .ptitle{font-size:14px;color:var(--ink2);padding:0 4px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* ---------- Night: pure black ---------- */
#night{background:#000;cursor:none}
.nwrap{display:flex;flex-direction:column;align-items:center;color:var(--night);opacity:var(--dim);
  transition:opacity .6s,transform 4s ease}
#night.peek .nwrap{opacity:var(--peek)}
#night .clock{font-size:min(25vw,48vh);font-weight:300}
.nalarm{font-size:clamp(16px,2.1vw,24px);font-weight:500;margin-top:.7em}
.nalarm .in{opacity:.7;font-weight:400}
.narm{font-size:15px;margin-top:1.3em;padding:7px 16px;border:1px solid currentColor;border-radius:999px}
.morning{position:absolute;bottom:calc(30px + var(--safe-b));opacity:0;pointer-events:none;transition:opacity .4s;
  border-radius:999px;padding:16px 30px;font-size:19px;font-weight:600;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.75)}
#night.peek .morning{opacity:1;pointer-events:auto}

/* ---------- Ringing ---------- */
#ring{background:linear-gradient(180deg,#1f2c5c 0%,#5a5f8e 55%,#e09a7c 100%);gap:14px}
#ring::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 40% at 50% 108%,rgba(255,179,138,.75),transparent 70%);
  animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
#ring>*{position:relative}
#ring .clock{font-size:min(19vw,34vh)}
.rlabel{font-size:clamp(22px,2.6vw,30px);font-weight:600;color:var(--ink)}
.rbtns{display:flex;gap:20px;margin-top:22px}
.big{border-radius:32px;min-width:240px;padding:32px 40px;font-size:28px;font-weight:700;transition:transform var(--fast) var(--ease)}
.big:active{transform:scale(.96)}
.big.snooze{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0)),var(--accent);color:var(--on-accent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),var(--drop)}

/* ---------- Sheets ---------- */
.sheetbg{position:fixed;inset:0;z-index:20;background:rgba(4,4,16,.42);display:flex;align-items:center;justify-content:center;
  animation:fade var(--fast)}
@keyframes fade{from{opacity:0}}
.sheet{width:min(600px,94vw);max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 30%),var(--sheet);
  -webkit-backdrop-filter:blur(34px) saturate(170%);backdrop-filter:blur(34px) saturate(170%);
  border:1px solid var(--stroke);border-radius:32px;padding:18px 22px 26px;box-shadow:var(--gloss),0 40px 90px -20px rgba(0,0,0,.7);
  animation:rise var(--med) var(--ease)}
.sh-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:10px;min-height:44px}
.sh-head h2{font-size:19px;font-weight:700}
.sh-head button{font-size:17px;color:var(--accent);font-weight:500;padding:8px 2px}
.sh-head button:first-child{justify-self:start}.sh-head button:last-child{justify-self:end}
.sh-head .bold{font-weight:700}
.glabel{font-size:14px;font-weight:600;color:var(--ink2);margin:18px 6px 8px}
.ghelp{font-size:14px;color:var(--ink3);margin:-2px 6px 8px;line-height:1.4}
.group{background:rgba(255,255,255,.06);border:1px solid var(--hair);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 16px;min-height:56px}
.row+.row{border-top:1px solid var(--hair)}
.row.col{flex-direction:column;align-items:stretch;gap:6px}
.rt{font-size:17px}.rs{font-size:14px;color:var(--ink3);margin-top:2px;line-height:1.35}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 15px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid transparent;font-size:15px;font-weight:600;
  transition:background var(--fast)}
.chip.on{background:var(--accent);color:var(--on-accent)}
.play{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);font-size:14px;flex:none}
.play.on{background:var(--accent);color:var(--on-accent)}
.style{padding:14px 16px}
.style+.style{border-top:1px solid var(--hair)}
.style h3{font-size:17px;font-weight:650;margin-bottom:3px}
.style p{font-size:14px;color:var(--ink2);line-height:1.4;margin-bottom:12px}
.style .line{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.style .line+.line{margin-top:10px}
.style .k{font-size:14px;color:var(--ink3)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;margin-top:-11px;
  background:linear-gradient(180deg,#fff,#e9e6f5);box-shadow:0 2px 10px rgba(0,0,0,.4),inset 0 1px 0 #fff}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.18);transition:background var(--fast)}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  transition:transform var(--fast) var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(20px)}
.arow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;cursor:pointer}
.arow+.arow{border-top:1px solid var(--hair)}
.arow.off .atext{opacity:.4}
.atime{font-family:var(--display);font-size:42px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1}
.atime small{font-family:var(--font);font-size:16px;margin-left:4px;font-weight:500}
.asub{font-size:15px;color:var(--ink2);margin-top:5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:12px;font-weight:650;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--ink2)}
.tag.g{background:rgba(216,204,255,.18);color:var(--moon)}
.tag.s{background:rgba(255,178,125,.16);color:var(--accent)}
.empty{text-align:center;color:var(--ink3);padding:26px 0 18px}
.wide{width:100%;min-height:52px;border-radius:16px;background:rgba(255,255,255,.09);font-size:17px;font-weight:650;color:var(--accent)}
.wide.mt{margin-top:14px}
.danger{width:100%;min-height:52px;border-radius:16px;background:rgba(255,90,80,.14);color:var(--bad);font-size:17px;font-weight:650;margin-top:18px}
.timein{display:block;margin:6px auto 4px;font-family:var(--display);font-size:56px;font-weight:300;text-align:center;
  background:rgba(255,255,255,.07);border:1px solid var(--hair);border-radius:20px;padding:8px 22px;color:#fff;color-scheme:dark;min-width:270px}
.days{display:flex;gap:8px;justify-content:space-between}
.day{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.08);font-weight:650}
.day.on{background:var(--accent);color:var(--on-accent)}
.txt{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--hair);border-radius:14px;padding:13px 15px;font-size:17px;outline:none}
.preview{display:flex;align-items:center;justify-content:center;background:#000;border-radius:14px;height:96px}
.preview span{font-family:var(--display);font-size:58px;font-weight:300;font-variant-numeric:tabular-nums;color:var(--night);opacity:var(--dim)}
.ok{color:var(--good)}.warn{color:var(--warn)}
.ver{text-align:center;font-size:13px;color:var(--ink3);margin-top:18px}
.toast{position:fixed;left:50%;top:calc(20px + var(--safe-t));transform:translateX(-50%);z-index:40;border-radius:999px;
  padding:11px 20px;font-size:15px;font-weight:600;animation:rise var(--med) var(--ease)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){.dbtn{padding:0 15px;font-size:16px}.dbtn .lbl{display:none}.big{min-width:150px;padding:26px 24px}}
</style>

<body>

<div id="day" class="screen">
  <button class="update glass hidden" id="upd" data-act="reload">Update ready · tap to reload</button>
  <div class="face">
    <div class="date" id="dDate"></div>
    <div class="clock" id="dClock"></div>
    <div class="aline" id="dAlarm"></div>
  </div>
  <div class="pop glass hidden" id="sleepPop"></div>
  <nav class="dock glass">
    <button class="dbtn" data-act="alarms">⏰ <span class="lbl">Alarms</span></button>
    <span class="sep"></span>
    <button class="dbtn" data-act="sleeppick" id="sleepChip"></button>
    <button class="dbtn primary" data-act="night">🌙 Good night</button>
    <span class="sep"></span>
    <button class="dbtn icon" data-act="settings" aria-label="Settings">⚙︎</button>
  </nav>
</div>

<div id="night" class="screen hidden">
  <div class="nwrap" id="nwrap">
    <div class="clock" id="nClock"></div>
    <div class="nalarm" id="nAlarm"></div>
    <div class="narm hidden" id="nArm">Tap to arm alarm</div>
  </div>
  <button class="morning" data-act="morning">☀︎ Good morning</button>
</div>

<div id="ring" class="screen hidden">
  <div class="clock" id="rClock"></div>
  <div class="rlabel" id="rLabel"></div>
  <div class="rbtns">
    <button class="big snooze" data-act="snooze" id="btnSnooze">Snooze</button>
    <button class="big glass" data-act="stop">Stop</button>
  </div>
</div>

<div id="sheet" class="sheetbg hidden"><div class="sheet" id="sheetBody" role="dialog" aria-modal="true"></div></div>

<script>
const APP_VERSION = 'dusk-1';
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY1 = ['S','M','T','W','T','F','S'];
const DAYN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const COLORS = { red:'#ff3b30', amber:'#ff9f0a', warm:'#f3e6d4' };
const SLEEP = { waves:{ name:'Waves', icon:'🌊' }, rain:{ name:'Rain', icon:'🌧' }, thunder:{ name:'Thunder', icon:'⛈' }, off:{ name:'Off', icon:'🔇' } };
const MIN = 60000, HOUR = 3600000;

/* ---------- storage ---------- */
function getJSON(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }catch(e){ return d; } }
function setJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

const DEFAULTS = { h24:false, nightColor:'red', dim:18, gentleSound:'chime', standardSound:'bright', fade:5,
  alarmVol:85, snooze:9, sleep:'waves', sleepVol:45 };
const S = Object.assign({}, DEFAULTS, getJSON('dusk_settings', {}));
let alarms = getJSON('dusk_alarms', []);
const ST = Object.assign({ mode:'day', snooze:null, lastCheck:Date.now() }, getJSON('dusk_state', {}));
if (ST.snooze && Date.now() - ST.snooze.at > 15*MIN) ST.snooze = null;
if (Date.now() - ST.lastCheck > 15*MIN) ST.lastCheck = Date.now();
let sheet = null, editing = null, ringing = null;

function saveSettings(){ setJSON('dusk_settings', S); }
function saveAlarms(){ setJSON('dusk_alarms', alarms); }
function saveState(){ setJSON('dusk_state', ST); }

/* ---------- time helpers ---------- */
function fmt(h, m){
  if (S.h24) return { hm:`${pad(h)}:${pad(m)}`, ap:'' };
  return { hm:`${h % 12 || 12}:${pad(m)}`, ap: h < 12 ? 'AM' : 'PM' };
}
function fmtText(h, m){ const f = fmt(h, m); return f.hm + (f.ap ? ' ' + f.ap : ''); }
function clockHTML(d){ const f = fmt(d.getHours(), d.getMinutes()); return esc(f.hm) + (f.ap ? `<span class="ap">${f.ap}</span>` : ''); }
function daysText(days){
  if (!days.length) return 'Once';
  const k = [...days].sort().join('');
  if (k === '0123456') return 'Every day';
  if (k === '12345') return 'Weekdays';
  if (k === '06') return 'Weekends';
  return [...days].sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(i => DAYN[i]).join(' ');
}
/* first time this alarm goes off strictly after `from` (ms) */
function occurrenceAfter(a, from){
  const f = new Date(from);
  for (let d = 0; d < 8; d++){
    const t = new Date(f.getFullYear(), f.getMonth(), f.getDate() + d, a.h, a.m, 0, 0);
    if (t.getTime() <= from) continue;
    if (a.days.length && !a.days.includes(t.getDay())) continue;
    return t;
  }
  return null;
}
function nextAlarm(now = Date.now()){
  let best = null;
  for (const a of alarms){
    if (!a.on) continue;
    const t = occurrenceAfter(a, now);
    if (t && (!best || t < best.t)) best = { t, a };
  }
  const sz = ST.snooze;
  if (sz && sz.at > now && (!best || sz.at < best.t.getTime()))
    best = { t:new Date(sz.at), a:{ label:sz.label, ring:true, gentle:sz.gentle }, snz:true };
  return best;
}
function untilText(t, now = Date.now()){
  const mins = Math.max(0, Math.ceil((t - now) / MIN));
  const h = Math.floor(mins / 60), m = mins % 60;
  return h ? `in ${h}h ${m}m` : `in ${m}m`;
}
function alarmLine(now = Date.now()){
  const n = nextAlarm(now);
  if (!n) return { none:true, html:'No alarm set' };
  let when = '';
  if (n.t - now > 22*HOUR) when = ' ' + DAYN[n.t.getDay()];
  const extra = n.snz ? ' · snoozed' : n.a.ring === false ? ' · silent' : '';
  return { none:false, html:`⏰ ${esc(fmtText(n.t.getHours(), n.t.getMinutes()))}${when} <span class="in">· ${untilText(n.t, now)}${extra}</span>` };
}

/* ---------- sky ---------- */
const SKY = [ // hour, top, mid, low, glow, glowAlpha, stars
  [0,   '#070a1c','#0d1230','#1b1a3e','#2a2350',.45, 1],
  [5.5, '#0b1030','#1c2350','#4a3a6a','#b0607a',.45, .8],
  [7,   '#1f2c5c','#5a5f8e','#d8957a','#ffb38a',.6,  0],

  const ch = []; for (let c = 0; c < buf.numberOfChannels; c++) ch.push(buf.getChannelData(c));

  for (let j = 0; j < n - X; j++){
    if (j < X){ const p = j / X; o[j] = at(j) * Math.sin(p * Math.PI / 2) + at(n - X + j) * Math.cos(p * Math.PI / 2); }

    const w = Math.random() * 2 - 1;
    b0 = .99765 * b0 + w * .099; b1 = .963 * b1 + w * .2965; b2 = .57 * b2 + w * 1.0527;
    const pink = (b0 + b1 + b2 + w * .1848) * .16;

/* ----- alarm melodies, generated in code ----- */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const INST = {
  chime:   { p:[1,2,3.01,4.2],  a:[1,.42,.22,.1],  d:[3.2,2,1.2,.7], send:.6 },
  marimba: { p:[1,3.99,9.9],    a:[1,.28,.05],     d:[1.1,.3,.09],   send:.35 },
  musicbox:{ p:[1,2,3,5.04],    a:[1,.45,.18,.08], d:[1.8,1,.55,.3], send:.5 },
  pluck:   { p:[1,2,3],         a:[1,.5,.25],      d:[.8,.45,.25],   send:.3, tri:true },
  bell:    { p:[1,2.01,2.76,4.07], a:[1,.5,.35,.15], d:[1.6,1.1,.8,.4], send:.45 }

  // Gentle: slow, warm, lots of air
  chime:    { name:'Chimes',    style:'gentle', inst:'chime', period:8,
              notes:[[0,76,.8],[.9,79,.7],[1.8,81,.75],[2.7,84,.8],[4.2,79,.6],[5.1,76,.6],[6,72,.75]] },
  marimba:  { name:'Marimba',   style:'gentle', inst:'marimba', period:6,

  musicbox: { name:'Music box', style:'gentle', inst:'musicbox', period:7,

  // Standard: brighter and busier, still musical

              notes:[[0,72,.8],[.2,76,.75],[.4,79,.8],[.6,84,.9],[1,79,.7],[1.2,84,.85]] },
  rise:     { name:'Rise',      style:'standard', inst:'marimba', period:2.4,
              notes:[[0,67,.8],[.15,71,.8],[.3,74,.85],[.45,79,.9],[.6,83,.95],[.9,86,1],[1.2,86,.9]] },
  bells:    { name:'Bells',     style:'standard', inst:'bell', period:1.6,

/* play(melodyKey, {fade: seconds to full volume, vol: 0..1}) → handle with .stop() */
function playMelody(key, { fade = 0, vol = S.alarmVol / 100 } = {}){

  const master = ctx.createGain(), dry = ctx.createGain(), wet = ctx.createGain();

/* ---------- tick: checks every second, catches up if the page was busy ---------- */
function due(now){
  const from = ST.lastCheck;
  if (ST.snooze && ST.snooze.at <= now){
    const s = ST.snooze; ST.snooze = null;
    if (now - s.at < 15*MIN) return { label:s.label, gentle:s.gentle };
  }
  let hit = null;
  for (const a of alarms){
    if (!a.on) continue;
    const t = occurrenceAfter(a, from);
    if (!t || t.getTime() > now) continue;
    if (!a.days.length) a.on = false;           // one-time alarms switch off after firing
    if (now - t.getTime() < 15*MIN && a.ring !== false && !hit) hit = { label:a.label || 'Alarm', gentle:a.gentle !== false };
  }
  return hit;
}
let lastSave = 0;
function tick(){
  const now = Date.now();
  if (!ringing){
    const before = JSON.stringify(alarms), hit = due(now);
    ST.lastCheck = now;
    if (JSON.stringify(alarms) !== before){ saveAlarms(); if (sheet === 'alarms') drawSheet(); }
    if (hit){ saveState(); startRing(hit); }
  } else ST.lastCheck = now;
  if (now - lastSave > 15000){ lastSave = now; saveState(); }
  const d = new Date(now);
  if (d.getMinutes() !== lastMin){
    lastMin = d.getMinutes();
    render();
    if (ST.mode === 'night' && !ringing) shiftNight();
  }
}

}
function alarmTags(a){
  return `<span class="tag ${a.gentle !== false ? 'g' : 's'}">${a.gentle !== false ? 'Gentle' : 'Standard'}</span>${a.ring === false ? '<span class="tag">Silent</span>' : ''}`;
}
function alarmsHTML(){
  if (editing){
    const e = editing;
    return `<div class="sh-head"><button data-act="ed-cancel">Cancel</button><h2>${e.isNew ? 'New alarm' : 'Edit alarm'}</h2><button class="bold" data-act="ed-save">Save</button></div>
      <input type="time" id="edTime" class="timein" value="${pad(e.h)}:${pad(e.m)}" aria-label="Alarm time">
      <div class="glabel">Repeat</div>
      <div class="days">${DAY1.map((d, i) => `<button class="day ${e.days.includes(i) ? 'on' : ''}" data-act="ed-day" data-i="${i}" aria-label="${DAYN[i]}">${d}</button>`).join('')}</div>
      <div class="glabel">Label</div>
      <input id="edLabel" class="txt" maxlength="40" placeholder="Alarm" value="${esc(e.label)}">
      <div class="glabel">Sound</div>
      <div class="group">
        <div class="row"><div><div class="rt">Gentle</div><div class="rs">${e.gentle !== false ? `Fades in over ${S.fade} min` : 'Off: Standard, full volume in about 20 seconds'}</div></div>${sw('ed-gentle', e.gentle !== false, 'Gentle')}</div>
        <div class="row"><div><div class="rt">Ring on this iPad</div><div class="rs">Off = just show it, like a mirror of your phone alarm</div></div>${sw('ed-ring', e.ring !== false, 'Ring on this iPad')}</div>
      </div>
      ${e.isNew ? '' : '<button class="danger" data-act="ed-del">Delete alarm</button>'}`;
  }
  const list = [...alarms].sort((x, y) => (x.h*60 + x.m) - (y.h*60 + y.m));
  return `<div class="sh-head"><span></span><h2>Alarms</h2><button class="bold" data-act="close">Done</button></div>
    ${list.length ? `<div class="group">${list.map(a => { const f = fmt(a.h, a.m); return `
      <div class="arow ${a.on ? '' : 'off'}" data-act="edit" data-id="${a.id}">
        <div class="atext"><div class="atime">${f.hm}${f.ap ? `<small>${f.ap}</small>` : ''}</div>
        <div class="asub">${esc(a.label || 'Alarm')} · ${daysText(a.days)} ${alarmTags(a)}</div></div>
        ${sw('al-' + a.id, a.on, 'Alarm on')}
      </div>`; }).join('')}</div>` : '<p class="empty">No alarms yet. Add one for tomorrow morning.</p>'}
    <button class="wide mt" data-act="add">+ Add alarm</button>`;
}
function audioStatus(){
  return armed() ? '<span class="ok">Armed</span>' : '<span class="warn">Not armed · tap anywhere</span>';
}
function settingsHTML(){
  const wake = !('wakeLock' in navigator) ? '<span class="warn">Not supported · set Auto-Lock to Never</span>' : wl ? '<span class="ok">On</span>' : '<span class="warn">Off · tap anywhere</span>';
  const nowF = fmt(new Date().getHours(), new Date().getMinutes());
  const pv = k => `<button class="play ${A.preview && A.preview.key === k ? 'on' : ''}" data-act="pv-alarm" data-v="${k}" aria-label="Preview">${A.preview && A.preview.key === k ? '■' : '▶'}</button>`;
  const soundChips = style => Object.entries(MELODY).filter(([, m]) => m.style === style)
    .map(([k, m]) => chip(style === 'gentle' ? 'gsound' : 'ssound', k, m.name, (style === 'gentle' ? S.gentleSound : S.standardSound) === k)).join('');
  const sleepOn = A.preview && A.preview.kind === 'sleep';
  const kind = A.srcKind[S.sleep];
  return `<div class="sh-head"><span></span><h2>Settings</h2><button class="bold" data-act="close">Done</button></div>
    <div class="glabel">Clock</div>
    <div class="group"><div class="row"><div class="rt">24-hour time</div>${sw('h24', S.h24, '24-hour time')}</div></div>

    <div class="glabel">Night mode</div>
    <div class="group">
      <div class="row"><div class="rt">Color</div><div class="chips">${chip('color','red','Red',S.nightColor==='red')}${chip('color','amber','Amber',S.nightColor==='amber')}${chip('color','warm','Warm white',S.nightColor==='warm')}</div></div>
      <div class="row col"><div class="rt">Brightness</div><input type="range" min="4" max="60" value="${S.dim}" data-range="dim" aria-label="Night brightness">
        <div class="preview"><span>${nowF.hm}</span></div></div>
    </div>

    <div class="glabel">Alarm styles</div>
    <div class="ghelp">Each alarm is Gentle or Standard. Pick it per alarm in Alarms.</div>
    <div class="group">
      <div class="style"><h3>Gentle</h3><p>Starts nearly silent and slowly gets louder, reaching full volume after the fade length. A calm melody, for waking up easy.</p>
        <div class="line"><div class="chips">${soundChips('gentle')}</div>${pv(S.gentleSound)}</div>
        <div class="line"><span class="k">Fade length</span><div class="chips">${[2,5,10].map(n => chip('fade', n, n + ' min', S.fade === n)).join('')}</div></div></div>
      <div class="style"><h3>Standard</h3><p>Still musical, never a buzzer. Brighter and busier, and at full volume in about 20 seconds.</p>
        <div class="line"><div class="chips">${soundChips('standard')}</div>${pv(S.standardSound)}</div></div>
      <div class="row col"><div class="rt">Alarm volume</div><input type="range" min="10" max="100" value="${S.alarmVol}" data-range="alarmVol" aria-label="Alarm volume"></div>
      <div class="row"><div class="rt">Snooze</div><div class="chips">${[5,9,10].map(n => chip('snz', n, n + ' min', S.snooze === n)).join('')}</div></div>
      <div class="row"><div style="flex:1"><button class="wide" data-act="test">Test alarm now</button><div class="rs" style="margin-top:8px">Rings your Gentle sound with a quick 15-second fade.</div></div></div>
    </div>

    <div class="glabel">Sleep sounds</div>
    <div class="ghelp">Plays from Good night until your alarm, then fades out before the alarm starts.</div>
    <div class="group">
      <div class="row"><div class="chips">${Object.entries(SLEEP).map(([k, s]) => chip('sleep', k, s.icon + ' ' + s.name, S.sleep === k)).join('')}</div>
        ${S.sleep === 'off' ? '' : `<button class="play ${sleepOn ? 'on' : ''}" data-act="pv-sleep" aria-label="Preview sleep sound">${sleepOn ? '■' : '▶'}</button>`}</div>
      <div class="row col"><div class="rt">Volume</div><input type="range" min="5" max="100" value="${S.sleepVol}" data-range="sleepVol" aria-label="Sleep sound volume">
        ${kind === 'built-in' ? '<div class="rs">Sound file not found, using the built-in version.</div>' : ''}</div>
    </div>

    <div class="glabel">Status</div>
    <div class="group">
      <div class="row"><div class="rt">Keep screen awake</div><div>${wake}</div></div>
      <div class="row"><div class="rt">Alarm audio</div><div id="stAudio">${audioStatus()}</div></div>
    </div>
    <div class="ghelp" style="margin-top:12px">Dusk can only ring while it's open on screen. Keep your phone alarm as a backup the first week.</div>
    <div class="ver">Version ${APP_VERSION}</div>`;
}
function captureEd(){
  if (!editing) return;
  const t = $('#edTime'), l = $('#edLabel');
  if (t && t.value){ const [h, m] = t.value.split(':').map(Number); editing.h = h; editing.m = m; }
  if (l) editing.label = l.value.trim();
}

/* ---------- sleep sound picker (dock) ---------- */
function showPop(){
  const p = $('#sleepPop');
  p.innerHTML = `<div class="ptitle">Sleep sound</div><div class="chips">${Object.entries(SLEEP).map(([k, s]) => chip('pop-sleep', k, s.icon + ' ' + s.name, S.sleep === k)).join('')}</div>`;
  p.classList.remove('hidden');
}
function hidePop(){ $('#sleepPop').classList.add('hidden'); }
function setSleep(k){
  S.sleep = k; saveSettings(); render();
  if (k !== 'off' && A.ctx) sleepBuffer(k); // preload
}

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener('pointerdown', e => {
  arm(); keepAwake();
  if (ST.mode === 'night' && !ringing && !sheet){
    const n = $('#night'); n.classList.add('peek');
    clearTimeout(n._t); n._t = setTimeout(() => n.classList.remove('peek'), 6000);
    if (!A.sleep && !ST.snooze) startSleep(4);   // e.g. after the app was reopened at night
    renderArm();
  }
  if (!e.target.closest('#sleepPop, #sleepChip')) hidePop();
}, { passive:true });

document.addEventListener('click', e => {
  if (e.target.closest('.sw')) return;
  if (e.target === $('#sheet')){ if (!editing) closeSheet(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  switch (act){
    case 'alarms': openSheet('alarms'); break;
    case 'settings': openSheet('settings'); if (S.sleep !== 'off' && A.ctx) sleepBuffer(S.sleep); break;
    case 'close': closeSheet(); break;
    case 'reload': location.reload(); break;
    case 'sleeppick': $('#sleepPop').classList.contains('hidden') ? showPop() : hidePop(); break;
    case 'pop-sleep': setSleep(v); hidePop(); break;
    case 'night':
      hidePop(); ST.mode = 'night'; ST.snooze = null; saveState(); renderMode(); shiftNight(); arm(); startSleep(8); break;
    case 'morning':
      stopSleep(2); ST.mode = 'day'; ST.snooze = null; saveState(); $('#night').classList.remove('peek'); renderMode(); break;
    case 'stop': doStop(); break;
    case 'snooze': doSnooze(); break;
    case 'add':
      editing = { isNew:true, id: Date.now().toString(36), h:7, m:0, days:[], label:'', ring:true, gentle:true, on:true };
      drawSheet(); break;
    case 'edit': {
      const a = alarms.find(x => x.id === el.dataset.id); if (!a) break;
      editing = { gentle:true, ...a, days:[...a.days], isNew:false }; drawSheet(); break; }
    case 'ed-cancel': editing = null; drawSheet(); break;
    case 'ed-day': {
      captureEd(); const i = +el.dataset.i;
      editing.days = editing.days.includes(i) ? editing.days.filter(x => x !== i) : [...editing.days, i];
      drawSheet(); break; }
    case 'ed-save': {
      captureEd(); const { isNew, ...a } = editing; a.on = true;
      alarms = isNew ? [...alarms, a] : alarms.map(x => x.id === a.id ? a : x);
      editing = null; saveAlarms(); drawSheet(); render();
      const t = occurrenceAfter(a, Date.now()); if (t) toast(`Alarm set for ${fmtText(a.h, a.m)} · ${untilText(t)}`);
      break; }
    case 'ed-del':
      alarms = alarms.filter(x => x.id !== editing.id); editing = null; saveAlarms(); drawSheet(); render(); break;
    case 'color': S.nightColor = v; saveSettings(); applyTheme(); drawSheet(); break;
    case 'gsound': S.gentleSound = v; saveSettings(); stopPreview(); previewAlarm(v); break;
    case 'ssound': S.standardSound = v; saveSettings(); stopPreview(); previewAlarm(v); break;
    case 'pv-alarm': previewAlarm(v); break;
    case 'fade': S.fade = +v; saveSettings(); drawSheet(); break;
    case 'snz': S.snooze = +v; saveSettings(); drawSheet(); break;
    case 'sleep': stopPreview(); setSleep(v); drawSheet(); break;
    case 'pv-sleep': previewSleep(); break;
    case 'test': arm(); startRing({ label:'Test alarm', gentle:true, test:true }); break;
  }
});

document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.sw; if (!k) return;
  const v = e.target.checked;
  if (k === 'h24'){ S.h24 = v; saveSettings(); render(); drawSheet(); }
  else if (k === 'ed-ring'){ captureEd(); editing.ring = v; }
  else if (k === 'ed-gentle'){ captureEd(); editing.gentle = v; drawSheet(); }
  else if (k.startsWith('al-')){
    const a = alarms.find(x => x.id === k.slice(3));
    if (a){ a.on = v; saveAlarms(); drawSheet(); render(); }
  }
});

document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.range; if (!k) return;
  S[k] = +e.target.value; saveSettings();
  if (k === 'dim') applyTheme();
  if (k === 'sleepVol'){
    const t = A.ctx && A.ctx.currentTime;
    for (const s of [A.sleep, A.preview && A.preview.kind === 'sleep' ? A.preview : null])
      if (s && s.g){ try { s.g.gain.cancelScheduledValues(t); s.g.gain.setTargetAtTime(sleepLevel(), t, .08); } catch(err){} }
  }
  if (k === 'alarmVol' && A.preview && A.preview.kind === 'alarm'){
    const t = A.ctx.currentTime; A.preview.h.master.gain.setTargetAtTime(Math.pow(S.alarmVol / 100, 1.5), t, .08);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet && !editing) closeSheet(); });

/* ---------- start ---------- */
applyTheme();
renderMode();
if (ST.mode === 'night') shiftNight();
keepAwake();
tick();
setInterval(tick, 1000);
setInterval(() => { if (ST.mode === 'day' && !ringing) checkUpdate(); }, 5*MIN);
checkUpdate();
window.__dusk = { S, ST, A, get ringing(){ return ringing; }, get alarms(){ return alarms; }, set alarms(v){ alarms = v; }, tick, startRing, MELODY };
</script>
</body>
</html>
